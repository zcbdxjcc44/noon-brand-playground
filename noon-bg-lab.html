<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noon Background Lab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; color: #fff; }
  canvas#bg { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* ============ PANEL ============ */
  .panel {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 320px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: rgba(12, 12, 16, 0.86);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 14px;
    padding: 18px;
    font-size: 12px;
    z-index: 10;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  .panel.hidden { transform: translateX(360px); opacity: 0; pointer-events: none; }
  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-track { background: transparent; }
  .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .panel header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
  .panel header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  .panel header .sub { font-size: 9.5px; color: rgba(255,255,255,0.4); margin-top: 3px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
  .panel header button.x {
    background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer;
    font-size: 18px; line-height: 1; padding: 0; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center; border-radius: 4px;
  }
  .panel header button.x:hover { background: rgba(255,255,255,0.06); color: #fff; }

  .section { border-top: 1px solid rgba(255,255,255,0.06); padding: 14px 0; }
  .section:first-of-type { border-top: none; padding-top: 0; }
  .section h2 {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.55);
    margin-bottom: 12px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    user-select: none;
  }
  .section h2 .chev { font-size: 9px; color: rgba(255,255,255,0.3); transition: transform 0.2s; }
  .section.collapsed h2 .chev { transform: rotate(-90deg); }
  .section.collapsed .controls { display: none; }

  .row { display: grid; grid-template-columns: 92px 1fr 38px; align-items: center; gap: 8px; margin-bottom: 7px; }
  .row label { font-size: 11px; color: rgba(255,255,255,0.65); }
  .row .value {
    text-align: right; font-size: 10px;
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.85);
    font-family: ui-monospace, 'SF Mono', monospace;
  }
  .row.row-wide { grid-template-columns: 92px 1fr; }
  .row.row-wide .value { display: none; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    background: transparent; height: 16px; width: 100%; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; background: #d9a84a; border-radius: 50%;
    margin-top: -5px; cursor: pointer;
    box-shadow: 0 0 0 0 rgba(217,168,74,0.3);
    transition: box-shadow 0.15s;
  }
  input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(217,168,74,0.15); }
  input[type="range"]::-moz-range-track { height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; }
  input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; background: #d9a84a; border-radius: 50%; border: none; cursor: pointer; }

  input[type="checkbox"] {
    accent-color: #d9a84a; cursor: pointer;
    width: 14px; height: 14px;
  }
  input[type="color"] {
    width: 100%; height: 22px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px; padding: 0;
    background: transparent; cursor: pointer;
  }
  select {
    background: rgba(255,255,255,0.05);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    width: 100%;
  }

  /* ============ CHARSET ============ */
  .charset-row {
    display: grid;
    grid-template-columns: 16px 92px 1fr 38px;
    align-items: center; gap: 7px;
    margin-bottom: 9px;
  }
  .charset-row .label-block { font-size: 11px; color: rgba(255,255,255,0.65); }
  .charset-row .label-block .preview {
    display: block; font-size: 9px;
    color: rgba(255,255,255,0.32);
    font-family: ui-monospace, monospace;
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .charset-row .value {
    text-align: right; font-size: 10px;
    font-variant-numeric: tabular-nums;
    color: rgba(255,255,255,0.85);
    font-family: ui-monospace, monospace;
  }

  /* ============ ACTIONS ============ */
  .actions {
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 6px; margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .actions button {
    background: rgba(255,255,255,0.05);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 8px 6px;
    border-radius: 6px;
    font-size: 11px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s;
  }
  .actions button:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.18); }
  .actions button:disabled { opacity: 0.35; cursor: not-allowed; }
  .actions button.primary {
    background: #d9a84a; color: #000;
    border-color: #d9a84a; font-weight: 600;
  }
  .actions button.primary:hover:not(:disabled) { background: #e6b75a; border-color: #e6b75a; }

  /* ============ PRESETS ============ */
  .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .presets button {
    background: rgba(255,255,255,0.03);
    color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 9px 10px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: all 0.15s;
  }
  .presets button:hover {
    border-color: rgba(217,168,74,0.5);
    background: rgba(217,168,74,0.06);
  }
  .presets button.active {
    border-color: #d9a84a;
    background: rgba(217,168,74,0.10);
  }
  .presets button .name { font-weight: 600; display: block; margin-bottom: 2px; font-size: 11px; position: relative; }
  .presets button .desc { display: block; font-size: 9px; color: rgba(255,255,255,0.4); line-height: 1.3; }
  .presets button.dirty .name::after {
    content: '•';
    color: #d9a84a;
    margin-left: 4px;
    font-size: 14px;
    line-height: 0;
    vertical-align: middle;
  }

  /* ============ SHOW PANEL BUTTON ============ */
  .show-panel {
    position: fixed; top: 16px; right: 16px;
    padding: 10px 14px;
    background: rgba(12,12,16,0.86);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: #fff;
    font-size: 11px;
    cursor: pointer;
    display: none;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    font-family: inherit;
    letter-spacing: 0.04em;
    z-index: 11;
  }
  .show-panel.show { display: block; }
  .show-panel:hover { background: rgba(20,20,26,0.9); border-color: rgba(255,255,255,0.14); }

  /* ============ HINT ============ */
  .hint {
    position: fixed; bottom: 16px; left: 16px;
    font-size: 10px; color: rgba(255,255,255,0.3);
    letter-spacing: 0.1em; z-index: 5;
    text-transform: uppercase;
  }
  .hint kbd {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px; border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1);
    font-family: ui-monospace, monospace;
    color: rgba(255,255,255,0.6);
  }

  /* ============ MODAL ============ */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #14141a;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 22px;
    width: 520px; max-width: 92vw;
  }
  .modal h3 {
    font-size: 13px; margin-bottom: 14px;
    font-weight: 600; letter-spacing: 0.02em;
  }
  .modal textarea {
    width: 100%; height: 320px;
    background: #0a0a0d;
    color: #d9a84a;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 12px;
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 11px; line-height: 1.5;
    resize: vertical;
  }
  .modal textarea:focus { outline: none; border-color: rgba(217,168,74,0.4); }
  .modal .modal-actions {
    display: flex; gap: 8px;
    justify-content: flex-end; margin-top: 14px;
  }
  .modal .modal-actions button {
    background: rgba(255,255,255,0.05);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer; font-family: inherit;
  }
  .modal .modal-actions button.primary {
    background: #d9a84a; color: #000;
    border-color: #d9a84a; font-weight: 600;
  }
  .modal .modal-actions button:hover { background: rgba(255,255,255,0.1); }
  .modal .modal-actions button.primary:hover { background: #e6b75a; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(217,168,74,0.95); color: #000;
    padding: 8px 18px; border-radius: 20px;
    font-size: 12px; font-weight: 500;
    z-index: 200;
    opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>

</div>

// =============================================================
// PERLIN NOISE 2D
// =============================================================
function makeNoise2D(seed) {
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  let s = seed || 1;
  function rng() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = p[i]; p[i] = p[j]; p[j] = tmp;
  }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(a, b, t) { return a + t * (b - a); }
  function grad(hash, x, y) {
    const h = hash & 7;
    const u = h < 4 ? x : y;
    const v = h < 4 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -2 * v : 2 * v);
  }

  return function(x, y) {
    const X = Math.floor(x) & 255;
    const Y = Math.floor(y) & 255;
    x -= Math.floor(x);
    y -= Math.floor(y);
    const u = fade(x);
    const v = fade(y);
    const aa = perm[perm[X] + Y];
    const ab = perm[perm[X] + Y + 1];
    const ba = perm[perm[X + 1] + Y];
    const bb = perm[perm[X + 1] + Y + 1];
    return lerp(
      lerp(grad(aa, x, y), grad(ba, x - 1, y), u),
      lerp(grad(ab, x, y - 1), grad(bb, x - 1, y - 1), u),
      v
    );
  };
}

// =============================================================
// STATE
// =============================================================
let config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
let activePresetIndex = 0;
let paused = false;
let isDirty = false;  // true when current config diverges from active preset's saved config
const charsetMemory = {};  // remembers last positive value per charset key

// Pristine factory copies, kept around for potential future "Revert" UX
const FACTORY_PRESETS = JSON.parse(JSON.stringify(PRESETS));
const STORAGE_KEY = 'noonBgLab.presets.v1';

function loadPersistedPresets() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (!Array.isArray(data)) return;
    for (let i = 0; i < data.length && i < PRESETS.length; i++) {
      const entry = data[i];
      if (!entry || !entry.config) continue;
      PRESETS[i].config = entry.config;
      if (entry.name) PRESETS[i].name = entry.name;
      if (entry.desc) PRESETS[i].desc = entry.desc;
    }
  } catch (e) { /* ignore corrupt storage */ }
}

function persistPresets() {
  try {
    const data = PRESETS.map(p => ({ name: p.name, desc: p.desc, config: p.config }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) { return false; }
}

function saveActivePreset() {
  if (activePresetIndex < 0 || !PRESETS[activePresetIndex]) {
    showToast('No active preset');
    return;
  }
  PRESETS[activePresetIndex].config = JSON.parse(JSON.stringify(config));
  const ok = persistPresets();
  markClean();
  showToast(ok ? ('Saved · ' + PRESETS[activePresetIndex].name) : 'Saved (storage unavailable)');
}

function markDirty() {
  if (isDirty) return;
  isDirty = true;
  updateSaveButton();
  updateActivePresetCard();
}
function markClean() {
  if (!isDirty) {
    updateSaveButton();
    updateActivePresetCard();
    return;
  }
  isDirty = false;
  updateSaveButton();
  updateActivePresetCard();
}
function updateSaveButton() {
  const btn = document.getElementById('saveBtn');
  if (!btn) return;
  if (activePresetIndex < 0 || !PRESETS[activePresetIndex]) {
    btn.disabled = true;
    btn.classList.remove('primary');
    btn.title = 'Pick a preset to save into';
  } else {
    btn.disabled = !isDirty;
    btn.classList.toggle('primary', isDirty);
    btn.title = isDirty
      ? 'Save changes to ' + PRESETS[activePresetIndex].name
      : 'No unsaved changes';
  }
}
function updateActivePresetCard() {
  document.querySelectorAll('.presets button').forEach((b, i) => {
    b.classList.toggle('dirty', i === activePresetIndex && isDirty);
  });
}

const noise = makeNoise2D(42);
const noise2 = makeNoise2D(7);
const pathNoise = makeNoise2D(123);

// =============================================================
// HELPERS
// =============================================================
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}
function hexToRgb(hex) {
  return {
    r: parseInt(hex.slice(1,3), 16),
    g: parseInt(hex.slice(3,5), 16),
    b: parseInt(hex.slice(5,7), 16)
  };
}
function lerp(a, b, t) { return a + (b - a) * t; }

// Deterministic char assignment: given a particle's persistent seeds + current
// charset weights, always returns the same char (until weights change).
// This means tweaking a charset slider only changes the particles whose target
// group flips — the rest stay put, so the texture stays stable.
function pickCharForParticle(p) {
  const cs = config.charset;
  let total = 0;
  const keys = Object.keys(CHAR_GROUPS);
  for (const k of keys) total += Math.max(0, cs[k] || 0);
  if (total <= 0) return '·';
  const target = p.charSeed1 * total;
  let cum = 0;
  for (const k of keys) {
    cum += Math.max(0, cs[k] || 0);
    if (target <= cum) {
      const group = CHAR_GROUPS[k];
      return group[Math.floor(p.charSeed2 * group.length) % group.length];
    }
  }
  const lastK = keys[keys.length - 1];
  const group = CHAR_GROUPS[lastK];
  return group[Math.floor(p.charSeed2 * group.length) % group.length];
}

// =============================================================
// PROJECTION (3D world -> 2D screen)
// =============================================================
function project(wx, wy, wz, view, w, h) {
  const cyy = Math.cos(view.yaw),  syy = Math.sin(view.yaw);
  const cpp = Math.cos(view.pitch), spp = Math.sin(view.pitch);

  // yaw around Y
  const x1 = wx * cyy - wz * syy;
  const z1 = wx * syy + wz * cyy;
  const y1 = wy;

  // translate to camera
  const xt = x1;
  const yt = y1 - view.cameraHeight;
  const zt = z1 + view.distance;

  // pitch (camera tilts down by pitch)
  const xc = xt;
  const yc = yt * cpp + zt * spp;
  const zc = -yt * spp + zt * cpp;

  if (zc < 1) return null;
  const f = view.fov;
  const sx = (xc * f) / zc + w / 2;
  const sy = (-yc * f) / zc + h / 2;
  return { sx: sx, sy: sy, depth: zc };
}

// =============================================================
// PARTICLE FIELD
// =============================================================
class ParticleField {
  constructor() {
    this.particles = [];
    this.terrainExtent = 1400;
    this.terrainDepth = 1100;
    this.gridSpacing = 32;
    this.rebuild();
  }

  rebuild() {
    const density = config.particles.density;
    const spacing = this.gridSpacing / density;
    const half = this.terrainExtent;
    const depth = this.terrainDepth;
    this.particles = [];

    for (let z = -depth; z <= depth; z += spacing) {
      for (let x = -half; x <= half; x += spacing) {
        const jx = (Math.random() - 0.5) * spacing * 0.7;
        const jz = (Math.random() - 0.5) * spacing * 0.7;
        const px = x + jx;
        const pz = z + jz;
        const p = {
          baseX: px, baseZ: pz,
          x: px, z: pz,
          vx: 0, vz: 0,
          char: '·',
          charSeed1: Math.random(),
          charSeed2: Math.random(),
          sizeT: Math.random(),
          phase: Math.random() * Math.PI * 2,
          baseAlphaJitter: 0.7 + Math.random() * 0.3
        };
        p.char = pickCharForParticle(p);
        this.particles.push(p);
      }
    }
  }

  // Re-evaluate char for every particle using deterministic seeds.
  // Stable: same particle always lands on the same char unless its target
  // group flips due to weight change.
  assignChars() {
    for (const p of this.particles) {
      p.char = pickCharForParticle(p);
    }
  }

  update(dt, time, goldenHead) {
    const g = config.goldenLine;
    const springBack = g.springBack;
    const dr = g.disturbanceRadius;
    const ds = g.disturbanceStrength;
    const dr2 = dr * dr;
    const damping = 0.88;
    const enabled = g.enabled && goldenHead;

    for (const p of this.particles) {
      // spring back
      p.vx += (p.baseX - p.x) * springBack;
      p.vz += (p.baseZ - p.z) * springBack;

      // disturbance
      if (enabled) {
        const dx = p.x - goldenHead.x;
        const dz = p.z - goldenHead.z;
        const d2 = dx * dx + dz * dz;
        if (d2 < dr2 && d2 > 0.01) {
          const d = Math.sqrt(d2);
          const force = (1 - d / dr) * ds * 8;
          p.vx += (dx / d) * force;
          p.vz += (dz / d) * force;
        }
      }

      // damping & integrate
      p.vx *= damping;
      p.vz *= damping;
      p.x += p.vx * dt;
      p.z += p.vz * dt;
    }
  }
}

// =============================================================
// GOLDEN LINE
// =============================================================
class GoldenLine {
  constructor() {
    this.t = -0.05;
    this.trail = [];
    this.maxTrail = 90;
  }

  pathPoint(t, time) {
    const W = 1300, D = 900;
    const type = config.goldenLine.pathType;
    let x, z;
    if (type === 'straight') {
      x = (t - 0.5) * 2 * W;
      z = D * 0.2 * Math.sin(time * 0.05);
    } else if (type === 'sine') {
      x = (t - 0.5) * 2 * W;
      z = Math.sin(t * Math.PI * 2 + time * 0.1) * D * 0.6;
    } else if (type === 'curve') {
      x = (t - 0.5) * 2 * W;
      z = Math.sin(t * Math.PI * 1.5) * D * 0.45 + Math.cos(time * 0.08) * 100;
    } else {
      x = (t - 0.5) * 2 * W;
      z = pathNoise(t * 2.5, time * 0.05) * D * 0.7;
    }
    return { x: x, y: 0, z: z };
  }

  update(dt, time) {
    if (!config.goldenLine.enabled) return;
    this.t += dt * config.goldenLine.speed * 0.3;
    if (this.t > 1.05) this.t = -0.05;
    const head = this.pathPoint(this.t, time);
    this.trail.push({ x: head.x, y: head.y, z: head.z, age: 0 });
    if (this.trail.length > this.maxTrail) this.trail.shift();
    for (const p of this.trail) p.age += dt;
  }

  getHead() {
    if (!config.goldenLine.enabled || this.trail.length === 0) return null;
    return this.trail[this.trail.length - 1];
  }
}

// =============================================================
// MORNING STAR (启明星 / Venus)
//   Bright concentrated core + 4 cardinal long rays + 4 diagonal short rays
//   + soft outer halo, with subtle twinkle pulse.
// =============================================================
function drawMorningStar(ctx, time, w, h) {
  const c = config.morningStar;
  if (!c.enabled) return;
  const cx = c.x * w;
  const cy = c.y * h;
  const r = c.size;
  const color = c.color;
  const op = c.opacity;

  // Twinkle pulse — affects rays/halo, leaves core mostly stable
  const t = c.twinkleSpeed > 0
    ? 0.78 + Math.sin(time * c.twinkleSpeed * 5.0) * 0.22 + Math.sin(time * c.twinkleSpeed * 13.0) * 0.06
    : 1.0;
  const opT = op * t;

  ctx.save();
  ctx.lineCap = 'round';

  // 1. Outer halo — large radial gradient
  const haloR = r * 2.6;
  const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, haloR);
  halo.addColorStop(0,    hexToRgba(color, opT * 0.50));
  halo.addColorStop(0.18, hexToRgba(color, opT * 0.22));
  halo.addColorStop(0.55, hexToRgba(color, opT * 0.05));
  halo.addColorStop(1,    hexToRgba(color, 0));
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(cx, cy, haloR, 0, Math.PI * 2);
  ctx.fill();

  // 2. Long cardinal rays (vertical + horizontal) — bright at center, fade out
  const rayLen = r * c.rayLength;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    const ex = cx + Math.cos(a) * rayLen;
    const ey = cy + Math.sin(a) * rayLen;
    const grad = ctx.createLinearGradient(cx, cy, ex, ey);
    grad.addColorStop(0,   hexToRgba(color, opT * 0.95));
    grad.addColorStop(0.25,hexToRgba(color, opT * 0.55));
    grad.addColorStop(0.7, hexToRgba(color, opT * 0.12));
    grad.addColorStop(1,   hexToRgba(color, 0));
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx - Math.cos(a) * 1, cy - Math.sin(a) * 1);
    ctx.lineTo(ex, ey);
    ctx.stroke();
  }

  // 3. Diagonal short rays
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + Math.PI / 4;
    const len = rayLen * 0.42;
    const ex = cx + Math.cos(a) * len;
    const ey = cy + Math.sin(a) * len;
    const grad = ctx.createLinearGradient(cx, cy, ex, ey);
    grad.addColorStop(0, hexToRgba(color, opT * 0.65));
    grad.addColorStop(0.5, hexToRgba(color, opT * 0.18));
    grad.addColorStop(1, hexToRgba(color, 0));
    ctx.strokeStyle = grad;
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(ex, ey);
    ctx.stroke();
  }

  // 4. Inner glow (slightly broader, warm)
  const innerR = r * 0.45;
  const inner = ctx.createRadialGradient(cx, cy, 0, cx, cy, innerR);
  inner.addColorStop(0, hexToRgba(color, op * 0.95));
  inner.addColorStop(0.5, hexToRgba(color, op * 0.45));
  inner.addColorStop(1, hexToRgba(color, 0));
  ctx.fillStyle = inner;
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
  ctx.fill();

  // 5. Bright white-hot core
  const coreR = Math.max(2, r * 0.12);
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
  core.addColorStop(0, 'rgba(255,255,255,' + Math.min(1, op * 1.0) + ')');
  core.addColorStop(0.5, hexToRgba(color, op * 0.95));
  core.addColorStop(1, hexToRgba(color, 0));
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// =============================================================
// RENDERER
// =============================================================
class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.field = new ParticleField();
    this.line = new GoldenLine();
    this.time = 0;
    this.cssW = window.innerWidth;
    this.cssH = window.innerHeight;
    this.dpr = 1;
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.dpr = dpr;
    this.cssW = window.innerWidth;
    this.cssH = window.innerHeight;
    this.canvas.width = this.cssW * dpr;
    this.canvas.height = this.cssH * dpr;
    this.canvas.style.width = this.cssW + 'px';
    this.canvas.style.height = this.cssH + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  draw() {
    const ctx = this.ctx;
    const w = this.cssW, h = this.cssH;
    const t = this.time;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);

    const view = config.view;
    const terrainScale = config.terrain.scale;
    const amp = config.terrain.amplitude;
    const driftZ = t * config.terrain.drift * 100;
    const contrast = config.terrain.contrast;
    const secondaryNoise = config.terrain.secondaryNoise;

    const sizeMin = config.particles.sizeMin;
    const sizeMax = config.particles.sizeMax;
    const baseAlpha = config.particles.baseAlpha;
    const twinkle = config.particles.twinkle;

    const head = this.line.getHead();
    const goldRgb = hexToRgb(config.goldenLine.color);
    const tintRadius = config.goldenLine.disturbanceRadius * 1.6;
    const tintRadius2 = tintRadius * tintRadius;

    // project + cull
    const projected = [];
    for (const p of this.field.particles) {
      const n1 = noise(p.x * terrainScale, (p.z + driftZ) * terrainScale);
      const n2 = noise2(p.x * terrainScale * 2.3, (p.z + driftZ) * terrainScale * 2.3) * secondaryNoise;
      const heightFactor = (n1 + 1) * 0.5;
      const hY = (n1 + n2 * 0.5) * amp;

      const pr = project(p.x, hY, p.z, view, w, h);
      if (!pr) continue;
      if (pr.sx < -100 || pr.sx > w + 100 || pr.sy < -100 || pr.sy > h + 200) continue;

      const tw = 1 + Math.sin(t * 2 + p.phase) * twinkle;
      const brightness = (1 - contrast) + contrast * heightFactor;
      const fadeNear = Math.min(1, pr.depth / 80);
      const fadeFar = Math.min(1, 1500 / pr.depth);
      let alpha = baseAlpha * brightness * tw * p.baseAlphaJitter * fadeNear * fadeFar;
      if (alpha < 0.02) continue;

      const size = (sizeMin + (sizeMax - sizeMin) * p.sizeT) * (450 / pr.depth);
      if (size < 1.5) continue;

      // tint near gold line
      let tint = 0;
      if (head && config.goldenLine.enabled) {
        const dx = p.x - head.x;
        const dz = p.z - head.z;
        const d2 = dx * dx + dz * dz;
        if (d2 < tintRadius2) {
          tint = (1 - Math.sqrt(d2) / tintRadius) * 0.7;
        }
      }
      let r = 255, g = 255, b = 255;
      if (tint > 0) {
        r = Math.round(lerp(255, goldRgb.r, tint));
        g = Math.round(lerp(255, goldRgb.g, tint));
        b = Math.round(lerp(255, goldRgb.b, tint));
        alpha = Math.min(1, alpha + tint * 0.15);
      }

      projected.push({ sx: pr.sx, sy: pr.sy, depth: pr.depth, char: p.char, size: size, alpha: alpha, r: r, g: g, b: b });
    }

    // back-to-front
    projected.sort((a, b) => b.depth - a.depth);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let lastSize = -1;
    for (const it of projected) {
      const sizeKey = Math.round(it.size * 4) / 4;
      if (sizeKey !== lastSize) {
        ctx.font = sizeKey + 'px ui-monospace, "SF Mono", Consolas, monospace';
        lastSize = sizeKey;
      }
      ctx.fillStyle = 'rgba(' + it.r + ',' + it.g + ',' + it.b + ',' + it.alpha.toFixed(3) + ')';
      ctx.fillText(it.char, it.sx, it.sy);
    }

    // golden line
    if (config.goldenLine.enabled && this.line.trail.length > 1) {
      const g = config.goldenLine;
      const trail = this.line.trail;

      const trailPts = new Array(trail.length);
      for (let i = 0; i < trail.length; i++) {
        const tp = trail[i];
        const n1 = noise(tp.x * terrainScale, (tp.z + driftZ) * terrainScale);
        const hY = n1 * amp + 6;
        trailPts[i] = project(tp.x, hY, tp.z, view, w, h);
      }

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // soft glow stroke under trail
      if (g.glowRadius > 0) {
        ctx.strokeStyle = hexToRgba(g.color, 0.10);
        ctx.lineWidth = Math.max(2, g.glowRadius * 0.35);
        ctx.beginPath();
        let started = false;
        for (let i = 0; i < trailPts.length; i++) {
          const pt = trailPts[i];
          if (!pt) { started = false; continue; }
          if (!started) { ctx.moveTo(pt.sx, pt.sy); started = true; }
          else { ctx.lineTo(pt.sx, pt.sy); }
        }
        ctx.stroke();
      }

      // main line, alpha ramps toward head
      for (let i = 1; i < trailPts.length; i++) {
        const a = trailPts[i-1];
        const b = trailPts[i];
        if (!a || !b) continue;
        const t01 = i / (trailPts.length - 1);
        const lineAlpha = Math.pow(t01, 1.4) * 0.95;
        ctx.strokeStyle = hexToRgba(g.color, lineAlpha);
        ctx.lineWidth = g.width * (0.4 + t01 * 0.7);
        ctx.beginPath();
        ctx.moveTo(a.sx, a.sy);
        ctx.lineTo(b.sx, b.sy);
        ctx.stroke();
      }

      // head bloom
      const headProj = trailPts[trailPts.length - 1];
      if (headProj && g.glowRadius > 0) {
        const grad = ctx.createRadialGradient(headProj.sx, headProj.sy, 0, headProj.sx, headProj.sy, g.glowRadius);
        grad.addColorStop(0, hexToRgba(g.color, 0.55));
        grad.addColorStop(0.4, hexToRgba(g.color, 0.16));
        grad.addColorStop(1, hexToRgba(g.color, 0));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(headProj.sx, headProj.sy, g.glowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = hexToRgba(g.color, 0.95);
        ctx.beginPath();
        ctx.arc(headProj.sx, headProj.sy, Math.max(1.5, g.width * 1.4), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // morning star overlay
    drawMorningStar(ctx, t, w, h);
  }
}

// =============================================================
// PANEL
// =============================================================
function buildPanel() {
  const body = document.getElementById('panelBody');
  body.innerHTML = '';

  // PRESETS
  const presetSec = createSection('Presets');
  const grid = document.createElement('div');
  grid.className = 'presets';
  PRESETS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.dataset.preset = i;
    btn.innerHTML = '<span class="name">' + p.name + '</span><span class="desc">' + p.desc + '</span>';
    if (i === activePresetIndex) btn.classList.add('active');
    btn.addEventListener('click', () => applyPreset(i));
    grid.appendChild(btn);
  });
  presetSec.controls.appendChild(grid);
  body.appendChild(presetSec.section);

  // SCHEMA-BASED SECTIONS
  for (const groupKey of ['view','terrain','particles','goldenLine','morningStar']) {
    const sec = createSection(GROUP_TITLES[groupKey]);
    for (const item of SCHEMA[groupKey]) {
      sec.controls.appendChild(createControl(groupKey, item));
    }
    body.appendChild(sec.section);
  }

  // CHARSET
  const csSec = createSection('Character Set');
  for (const k of Object.keys(CHAR_GROUPS)) {
    csSec.controls.appendChild(createCharsetRow(k));
  }
  body.appendChild(csSec.section);

  // ACTIONS
  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.innerHTML =
    '<button id="saveBtn">Save</button>' +
    '<button id="exportBtn">Export</button>' +
    '<button id="importBtn">Import</button>' +
    '<button id="resetBtn">Reset</button>';
  body.appendChild(actions);
  document.getElementById('saveBtn').addEventListener('click', saveActivePreset);
  document.getElementById('exportBtn').addEventListener('click', exportPreset);
  document.getElementById('importBtn').addEventListener('click', importPreset);
  document.getElementById('resetBtn').addEventListener('click', () => {
    activePresetIndex = -1;
    applyConfig(DEFAULT_CONFIG);
  });

  updateSaveButton();
  updateActivePresetCard();
}

function createSection(title) {
  const section = document.createElement('div');
  section.className = 'section';
  const h = document.createElement('h2');
  h.innerHTML = title + '<span class="chev">▾</span>';
  h.addEventListener('click', () => section.classList.toggle('collapsed'));
  const controls = document.createElement('div');
  controls.className = 'controls';
  section.appendChild(h);
  section.appendChild(controls);
  return { section: section, controls: controls };
}

function createControl(group, item) {
  const row = document.createElement('div');
  row.className = (item.type === 'check' || item.type === 'select' || item.type === 'color')
    ? 'row row-wide' : 'row';

  const label = document.createElement('label');
  label.textContent = item.label;
  row.appendChild(label);

  if (item.type === 'range') {
    const input = document.createElement('input');
    input.type = 'range';
    input.min = item.min; input.max = item.max; input.step = item.step;
    input.value = config[group][item.key];
    const valueEl = document.createElement('div');
    valueEl.className = 'value';
    valueEl.textContent = formatValue(input.value, item.step);
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      config[group][item.key] = v;
      valueEl.textContent = formatValue(v, item.step);
      onConfigChange(group, item.key);
    });
    row.appendChild(input);
    row.appendChild(valueEl);
  } else if (item.type === 'check') {
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!config[group][item.key];
    input.addEventListener('change', () => {
      config[group][item.key] = input.checked;
      onConfigChange(group, item.key);
    });
    const wrap = document.createElement('div');
    wrap.appendChild(input);
    row.appendChild(wrap);
  } else if (item.type === 'select') {
    const sel = document.createElement('select');
    for (const opt of item.options) {
      const o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      sel.appendChild(o);
    }
    sel.value = config[group][item.key];
    sel.addEventListener('change', () => {
      config[group][item.key] = sel.value;
      onConfigChange(group, item.key);
    });
    row.appendChild(sel);
  } else if (item.type === 'color') {
    const input = document.createElement('input');
    input.type = 'color';
    input.value = config[group][item.key];
    input.addEventListener('input', () => {
      config[group][item.key] = input.value;
      onConfigChange(group, item.key);
    });
    row.appendChild(input);
  }
  return row;
}

function createCharsetRow(key) {
  const row = document.createElement('div');
  row.className = 'charset-row';

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = config.charset[key] > 0;

  const labelDiv = document.createElement('div');
  labelDiv.className = 'label-block';
  labelDiv.innerHTML = CHAR_LABELS[key].name + '<span class="preview">' + CHAR_LABELS[key].preview + '</span>';

  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = 0; slider.max = 1; slider.step = 0.01;
  slider.value = config.charset[key];

  const valueEl = document.createElement('div');
  valueEl.className = 'value';
  valueEl.textContent = parseFloat(config.charset[key]).toFixed(2);

  cb.addEventListener('change', () => {
    if (cb.checked) {
      const prev = charsetMemory[key];
      config.charset[key] = (prev && prev > 0) ? prev : 0.25;
    } else {
      if (config.charset[key] > 0) charsetMemory[key] = config.charset[key];
      config.charset[key] = 0;
    }
    slider.value = config.charset[key];
    valueEl.textContent = parseFloat(config.charset[key]).toFixed(2);
    renderer.field.assignChars();
    markDirty();
  });

  slider.addEventListener('input', () => {
    const v = parseFloat(slider.value);
    config.charset[key] = v;
    if (v > 0) charsetMemory[key] = v;
    valueEl.textContent = v.toFixed(2);
    cb.checked = v > 0;
    renderer.field.assignChars();
    markDirty();
  });

  row.appendChild(cb);
  row.appendChild(labelDiv);
  row.appendChild(slider);
  row.appendChild(valueEl);
  return row;
}

function formatValue(v, step) {
  v = parseFloat(v);
  if (step >= 1) return Math.round(v).toString();
  if (step >= 0.1) return v.toFixed(1);
  if (step >= 0.01) return v.toFixed(2);
  return v.toFixed(3);
}

function onConfigChange(group, key) {
  if (group === 'particles' && key === 'density') {
    renderer.field.rebuild();
  }
  markDirty();
}

function applyPreset(i) {
  const preset = PRESETS[i];
  if (!preset) return;
  activePresetIndex = i;
  applyConfig(preset.config);
}

function applyConfig(newConfig) {
  // deep merge into config
  config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  for (const k in newConfig) {
    if (typeof newConfig[k] === 'object' && newConfig[k] !== null) {
      config[k] = Object.assign({}, config[k], newConfig[k]);
    } else {
      config[k] = newConfig[k];
    }
  }
  // Sync charset memory with newly applied values so re-checking restores them
  for (const k of Object.keys(CHAR_GROUPS)) {
    if (config.charset[k] > 0) charsetMemory[k] = config.charset[k];
  }
  isDirty = false;
  buildPanel();
  renderer.field.rebuild();
}

// =============================================================
// MODAL: EXPORT / IMPORT
// =============================================================
function exportPreset() {
  const m = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = 'Export Preset';
  const out = {
    name: PRESETS[activePresetIndex] ? PRESETS[activePresetIndex].name + ' (custom)' : 'Custom Preset',
    config: config
  };
  const ta = document.getElementById('modalText');
  ta.value = JSON.stringify(out, null, 2);
  ta.readOnly = false;
  document.getElementById('modalApply').style.display = 'none';
  m.classList.add('show');
}

function importPreset() {
  const m = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = 'Import Preset';
  const ta = document.getElementById('modalText');
  ta.value = '';
  ta.placeholder = 'Paste preset JSON here...';
  ta.readOnly = false;
  document.getElementById('modalApply').style.display = '';
  m.classList.add('show');
}

document.getElementById('modalCopy').addEventListener('click', () => {
  const t = document.getElementById('modalText');
  t.select();
  try { navigator.clipboard.writeText(t.value); } catch (e) {}
  showToast('Copied');
});
document.getElementById('modalApply').addEventListener('click', () => {
  try {
    const data = JSON.parse(document.getElementById('modalText').value);
    if (data && data.config) applyConfig(data.config);
    else applyConfig(data);
    document.getElementById('modal').classList.remove('show');
    activePresetIndex = -1;
    showToast('Preset applied');
  } catch (e) {
    showToast('Invalid JSON');
  }
});
document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

// =============================================================
// MAIN
// =============================================================
const canvas = document.getElementById('bg');
const renderer = new Renderer(canvas);
renderer.resize();
window.addEventListener('resize', () => renderer.resize());

loadPersistedPresets();
buildPanel();
applyPreset(0);

document.addEventListener('keydown', (e) => {
  if ((e.key === 'h' || e.key === 'H') && !isEditing(e.target)) {
    document.getElementById('panel').classList.toggle('hidden');
    document.getElementById('showPanelBtn').classList.toggle('show');
  }
  if (e.key === ' ' && !isEditing(e.target)) {
    paused = !paused;
    e.preventDefault();
  }
});
function isEditing(el) {
  if (!el) return false;
  const tag = (el.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select';
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('showPanelBtn').classList.add('show');
});
document.getElementById('showPanelBtn').addEventListener('click', () => {
  document.getElementById('panel').classList.remove('hidden');
  document.getElementById('showPanelBtn').classList.remove('show');
});

// loop
let lastTime = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (!paused) {
    renderer.time += dt;
    renderer.line.update(dt, renderer.time);
    const head = renderer.line.getHead();
    renderer.field.update(dt, renderer.time, head);
  }
  renderer.draw();
  requestAnimationFrame(loop);
}
loop();
</script>
