    const palette = CONSTELLATION_PALETTES[cfg.palette] || CONSTELLATION_PALETTES['Aurora'];
    const palRgb = palette.map(hexToRgb);
    const S = cfg.worldScale;
    const depthScale = cfg.depthScale != null ? cfg.depthScale : 1;
    const sizeMin = cfg.sizeMin, sizeMax = cfg.sizeMax;
    const glow = cfg.glow;

    if (glow > 0.005) {
      // Additive glow sprites — overlapping dense regions bloom toward white.
      const sprites = this._ensureGlowSprites(palette);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35 + glow * 0.55;
      for (const p of field.particles) {
        const pr = project(p.x * S, p.y * S, p.z * S * depthScale, view, w, h);
        if (!pr) continue;
        if (pr.sx < -60 || pr.sx > w + 60 || pr.sy < -60 || pr.sy > h + 60) continue;
        const base = (sizeMin + (sizeMax - sizeMin) * p.sizeT) * (450 / pr.depth);
        const r = base * (1.4 + glow * 2.4);
        if (r < 1) continue;
        const ci = (p.colorT * palRgb.length) | 0;
        const sprite = sprites[ci < palRgb.length ? ci : 0];
        ctx.drawImage(sprite, pr.sx - r, pr.sy - r, r * 2, r * 2);
      }
      ctx.restore();
    } else {
      // Flat dots — crisp, no bloom.
      for (const p of field.particles) {
        const pr = project(p.x * S, p.y * S, p.z * S * depthScale, view, w, h);
        if (!pr) continue;
        if (pr.sx < -60 || pr.sx > w + 60 || pr.sy < -60 || pr.sy > h + 60) continue;
        const size = (sizeMin + (sizeMax - sizeMin) * p.sizeT) * (450 / pr.depth);
        if (size < 0.6) continue;
        const ci = (p.colorT * palRgb.length) | 0;
        const c = palRgb[ci < palRgb.length ? ci : 0];
        ctx.fillStyle = 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')';
        ctx.beginPath();
        ctx.arc(pr.sx, pr.sy, size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // =============================================================
  // STAR CHART — the current subject's hand-authored star graph,
  // drawn as a quiet navigation diagram: hairline connectors (some
  // incomplete, dissolving into the dark), restrained star points,
  // a few brighter anchor stars. Edges breathe; anchors twinkle.
  // The whole graph drifts very slowly around the vertical axis.
  // =============================================================
  drawStarChart() {
    const ctx = this.ctx;
    const w = this.cssW, h = this.cssH;
    const view = config.view;
    const cfg = config.starchart;
    const field = this.starchart;
    field.sync();
    if (field.stars.length === 0) return;

    const S = cfg.worldScale;
    const depthScale = cfg.depthScale != null ? cfg.depthScale : 1;
    const drift = this.time * cfg.driftSpeed * 0.5;
    const cd = Math.cos(drift), sd = Math.sin(drift);
    // a barely-there vertical bob so the chart never feels frozen
    const bob = Math.sin(this.time * 0.18) * 0.015;
    const t = this.time;

    const lineRgb = hexToRgb(STARCHART_LINE_COLORS[cfg.lineColor] || STARCHART_LINE_COLORS['Silver']);
    const starRgb = hexToRgb(STARCHART_STAR_COLORS[cfg.starColor] || STARCHART_STAR_COLORS['Warm White']);
    const master = cfg.brightness;

    // project every star once
    const P = new Array(field.stars.length);
    for (let i = 0; i < field.stars.length; i++) {
      const s = field.stars[i];
      const rx = s.x * cd + s.z * sd;
      const rz = -s.x * sd + s.z * cd;
      P[i] = project(rx * S, (s.y + bob) * S, rz * S * depthScale, view, w, h);
    }

    // ---- edges (hairlines) — drawn first, beneath the stars -------------
    ctx.lineCap = 'round';
    for (const e of field.edges) {
      const a = P[e.a], b = P[e.b];
      if (!a || !b) continue;

      // breathing — a slow sine, never fully off so the structure persists
      const breathe = 0.5 + 0.5 * Math.sin(t * e.brRate * 0.6 + e.brPhase);
      const edgeAlpha = master * (0.14 + breathe * (0.10 + cfg.breathing * 0.5));
      if (edgeAlpha < 0.004) continue;

      // a broken edge stops partway and dissolves — "naturally disappears"
      let ex = b.sx, ey = b.sy;
      if (e.broken) {
        const cut = Math.max(0.18, e.cut - cfg.brokenness * 0.34);
        ex = a.sx + (b.sx - a.sx) * cut;
        ey = a.sy + (b.sy - a.sy) * cut;
      }
      this._drawChartEdge(a.sx, a.sy, ex, ey, lineRgb, edgeAlpha, cfg, e.broken);
    }

    // ---- stars ----------------------------------------------------------
    for (let i = 0; i < field.stars.length; i++) {
      const p = P[i];
      if (!p) continue;
      if (p.sx < -40 || p.sx > w + 40 || p.sy < -40 || p.sy > h + 40) continue;
      this._drawChartStar(p, field.stars[i], starRgb, cfg, master, t);
    }
  }

  // A hairline connector. Both ends fade softly so the connection reads
  // as "found", not pinned. A broken edge's b-end dissolves fully to 0.
  _drawChartEdge(ax, ay, bx, by, rgb, alpha, cfg, broken) {
    const ctx = this.ctx;
    const col = (al) => 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + Math.max(0, al).toFixed(3) + ')';

    // very slight glow underneath — solid + faint, barely there
    if (cfg.lineGlow > 0.01) {
      ctx.strokeStyle = col(alpha * cfg.lineGlow * 0.7);
      ctx.lineWidth = cfg.lineWidth * 3.0;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }

    const grad = ctx.createLinearGradient(ax, ay, bx, by);
    grad.addColorStop(0,    col(alpha * 0.32));
    grad.addColorStop(0.20, col(alpha));
    grad.addColorStop(0.74, col(alpha * (broken ? 0.5 : 0.92)));
    grad.addColorStop(1,    col(broken ? 0 : alpha * 0.42));
    ctx.strokeStyle = grad;
    ctx.lineWidth = cfg.lineWidth;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }

  // A star point. Anchor stars are larger/brighter with a faint halo and
  // a tiny white centre; plain stars stay restrained. Both twinkle slowly.
  _drawChartStar(p, s, rgb, cfg, master, t) {
    const ctx = this.ctx;
    const dscale = 420 / p.depth;
    let size = (s.anchor ? cfg.anchorSize : cfg.starSize) * dscale;

    // twinkle — subtle, slow; anchors twinkle more than plain stars
    const tw = Math.sin(t * s.twRate * 0.5 + s.twPhase);
    const twAmt = s.anchor ? cfg.twinkle : cfg.twinkle * 0.35;
    const twMul = 1 + tw * twAmt * 0.5;
    size *= twMul;
    if (size < 0.25) return;

    const aBase = s.anchor ? 0.95 : 0.52;
    const alpha = Math.min(1, master * aBase * (0.82 + 0.18 * twMul));
    const col = (al) => 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + Math.max(0, al).toFixed(3) + ')';

    // faint halo — anchors only, very subtle
    if (s.anchor) {
      const hr = size * 3.6;
      const gh = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, hr);
      gh.addColorStop(0,   col(alpha * 0.26));
      gh.addColorStop(0.5, col(alpha * 0.09));
      gh.addColorStop(1,   col(0));
      ctx.fillStyle = gh;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, hr, 0, Math.PI * 2); ctx.fill();
    }

    // crisp core
    ctx.fillStyle = col(alpha);
    ctx.beginPath(); ctx.arc(p.sx, p.sy, size, 0, Math.PI * 2); ctx.fill();

    // tiny white centre on anchors → reads as a deliberate navigation mark
    if (s.anchor) {
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.9, alpha * 0.8).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.sx, p.sy, size * 0.42, 0, Math.PI * 2); ctx.fill();
    }
  }

  // =============================================================
  // SAND — grains flow on a noise wind field while being softly
  // pulled toward "home" points sampled from the subject's 3D
  // cloud. Rendered as a fine, dense field of individual grains in
  // warm sand tones — the wind keeps the whole form churning.
  // =============================================================
  drawSand() {
    const ctx = this.ctx;
    const w = this.cssW, h = this.cssH;
    const view = config.view;
    const cfg = config.sand;
    const field = this.sand;
    if (field.grains.length === 0) field.rebuild();

    const pal = SAND_PALETTES[cfg.palette] || SAND_PALETTES['Dune'];
    const S = cfg.worldScale;
    const depthScale = cfg.depthScale != null ? cfg.depthScale : 1;

    // ---- project grains to screen --------------------------------------
    const grains = field.grains;
    const N = grains.length;
    const px = new Float32Array(N);
    const py = new Float32Array(N);
    const pd = new Float32Array(N);
    const pok = new Uint8Array(N);
    let anyVisible = false;
    for (let i = 0; i < N; i++) {
      const g = grains[i];
      const pr = project(g.x * S, g.y * S, g.z * S * depthScale, view, w, h);
      if (!pr) continue;
      px[i] = pr.sx; py[i] = pr.sy; pd[i] = pr.depth; pok[i] = 1;
      anyVisible = true;
    }
    if (!anyVisible) return;

    // ---- grains: the main layer — fine, dense dots in warm sand tones.
    // Colour blends across the palette by colorT; near grains lift bright.
    const cShadow = hexToRgb(pal.shadow);
    const cMid = hexToRgb(pal.mid);
    const cLit = hexToRgb(pal.lit);
    const cSpeck = hexToRgb(pal.speckle);
    const gs = cfg.grainSize;
    for (let i = 0; i < N; i++) {
      if (!pok[i]) continue;
      const g = grains[i];
      const size = (0.5 + g.sizeT) * gs * Math.min(2.2, 420 / pd[i]);
      if (size < 0.4) continue;
      const ct = g.colorT;
      let r, gg, b;
      if (ct < 0.5) {
        const t = ct / 0.5;
        r = cShadow.r + (cMid.r - cShadow.r) * t;
        gg = cShadow.g + (cMid.g - cShadow.g) * t;
        b = cShadow.b + (cMid.b - cShadow.b) * t;
      } else if (ct < 0.85) {
        const t = (ct - 0.5) / 0.35;
        r = cMid.r + (cLit.r - cMid.r) * t;
        gg = cMid.g + (cLit.g - cMid.g) * t;
        b = cMid.b + (cLit.b - cMid.b) * t;
      } else {
        const t = (ct - 0.85) / 0.15;
        r = cLit.r + (cSpeck.r - cLit.r) * t;
        gg = cLit.g + (cSpeck.g - cLit.g) * t;
        b = cLit.b + (cSpeck.b - cLit.b) * t;
      }
      const lift = Math.min(0.35, 60 / pd[i]);
      r = r + (255 - r) * lift;
      gg = gg + (255 - gg) * lift;
      b = b + (255 - b) * lift;
      ctx.fillStyle = 'rgb(' + (r | 0) + ',' + (gg | 0) + ',' + (b | 0) + ')';
      ctx.beginPath();
      ctx.arc(px[i], py[i], size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawGoldenLine() {
    const ctx = this.ctx;
    const w = this.cssW, h = this.cssH;
    const t = this.time;
    const view = config.view;
    const terrainScale = config.terrain.scale;
    const amp = config.terrain.amplitude;
    const driftZ = t * config.terrain.drift * 100;
    const g = config.goldenLine;
    const trail = this.line.trail;

    // For faceted style, the trail rides the *triangulated* surface so it
    // visually sits on the visible faces. Other styles use smooth noise.
    const useFacetHeights = config.style === 'faceted' && this.faceted.heights;

    const trailPts = new Array(trail.length);
    for (let i = 0; i < trail.length; i++) {
      const tp = trail[i];
      let hY;
      if (useFacetHeights) {
        const fh = this.faceted.heightAt(tp.x, tp.z);
        if (fh !== null) {
          hY = fh + 4;
        } else {
          const n1 = noise(tp.x * terrainScale, (tp.z + driftZ) * terrainScale);
          hY = n1 * amp + 6;
        }
      } else {
        const n1 = noise(tp.x * terrainScale, (tp.z + driftZ) * terrainScale);
        hY = n1 * amp + 6;
      }
      trailPts[i] = project(tp.x, hY, tp.z, view, w, h);
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (g.glowRadius > 0) {
      ctx.strokeStyle = hexToRgba(g.color, 0.10);
      ctx.lineWidth = Math.max(2, g.glowRadius * 0.35);
      ctx.beginPath();
      let started = false;
      for (let i = 0; i < trailPts.length; i++) {
        const pt = trailPts[i];
        if (!pt) { started = false; continue; }
        if (!started) { ctx.moveTo(pt.sx, pt.sy); started = true; }
        else { ctx.lineTo(pt.sx, pt.sy); }
      }
      ctx.stroke();
    }

    for (let i = 1; i < trailPts.length; i++) {
      const a = trailPts[i-1];
      const b = trailPts[i];
      if (!a || !b) continue;
      const t01 = i / (trailPts.length - 1);
      const lineAlpha = Math.pow(t01, 1.4) * 0.95;
      ctx.strokeStyle = hexToRgba(g.color, lineAlpha);
      ctx.lineWidth = g.width * (0.4 + t01 * 0.7);
      ctx.beginPath();
      ctx.moveTo(a.sx, a.sy);
      ctx.lineTo(b.sx, b.sy);
      ctx.stroke();
    }

    const headProj = trailPts[trailPts.length - 1];
    if (headProj && g.glowRadius > 0) {
      const grad = ctx.createRadialGradient(headProj.sx, headProj.sy, 0, headProj.sx, headProj.sy, g.glowRadius);
      grad.addColorStop(0, hexToRgba(g.color, 0.55));
      grad.addColorStop(0.4, hexToRgba(g.color, 0.16));
      grad.addColorStop(1, hexToRgba(g.color, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(headProj.sx, headProj.sy, g.glowRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = hexToRgba(g.color, 0.95);
      ctx.beginPath();
      ctx.arc(headProj.sx, headProj.sy, Math.max(1.5, g.width * 1.4), 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// =============================================================
// PANEL
// =============================================================
function buildPanel() {
  const body = document.getElementById('panelBody');
  body.innerHTML = '';

  // PRESETS (top)
  const presetSec = createSection('Presets');
  const grid = document.createElement('div');
  grid.className = 'presets';
  PRESETS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.dataset.preset = i;
    btn.innerHTML = '<span class="name">' + p.name + '</span><span class="desc">' + p.desc + '</span>';
    if (i === activePresetIndex) btn.classList.add('active');
    btn.addEventListener('click', () => applyPreset(i));
    grid.appendChild(btn);
  });
  presetSec.controls.appendChild(grid);
  body.appendChild(presetSec.section);

  // STYLE + PALETTE (segmented pills)
  const styleSec = createSection('Style & Palette');
  const styleRow = document.createElement('div');
  styleRow.className = 'seg seg-2 seg-row';
  STYLES.forEach(s => {
    const b = document.createElement('button');
    b.textContent = s.charAt(0).toUpperCase() + s.slice(1);
    if (config.style === s) b.classList.add('active');
    b.addEventListener('click', () => {
      if (config.style !== s) {
        config.style = s;
        markDirty();
        buildPanel();
      }
    });
    styleRow.appendChild(b);
  });
  styleSec.controls.appendChild(styleRow);

  // Faceted is locked to Void palette — hide the palette selector for it
  if (config.style !== 'faceted') {
    const paletteRow = document.createElement('div');
    paletteRow.className = 'seg seg-2';
    Object.keys(PALETTES).forEach(pk => {
      const b = document.createElement('button');
      b.textContent = PALETTES[pk].name;
      if (config.palette === pk) b.classList.add('active');
      b.addEventListener('click', () => {
        if (config.palette !== pk) {
          config.palette = pk;
          markDirty();
          buildPanel();
        }
      });
      paletteRow.appendChild(b);
    });
    styleSec.controls.appendChild(paletteRow);
  }
  body.appendChild(styleSec.section);

  // SCHEMA-BASED SECTIONS — filtered by current style
  const isParticles = config.style === 'particles';
  const isContours = config.style === 'contours';
  const isFaceted = config.style === 'faceted';
  const isConstellation = config.style === 'constellation';
  const isStarChart = config.style === 'starchart';
  const isSand = config.style === 'sand';
  // These subject-based styles live on their own plane — no noise terrain.
  const groupOrder = (isConstellation || isStarChart || isSand) ? ['view'] : ['view','terrain'];
  if (isParticles) groupOrder.push('particles');
  if (isContours) groupOrder.push('contours');
  if (isFaceted) groupOrder.push('faceted');
  if (isConstellation) groupOrder.push('constellation');
  if (isStarChart) groupOrder.push('starchart');
  if (isSand) groupOrder.push('sand');
  groupOrder.push('goldenLine', 'morningStar');

  for (const groupKey of groupOrder) {
    const sec = createSection(GROUP_TITLES[groupKey]);
    for (const item of SCHEMA[groupKey]) {
      sec.controls.appendChild(createControl(groupKey, item));
    }
    body.appendChild(sec.section);
  }

  // CHARSET — only for particles
  if (isParticles) {
    const csSec = createSection('Character Set');
    for (const k of Object.keys(CHAR_GROUPS)) {
      csSec.controls.appendChild(createCharsetRow(k));
    }
    body.appendChild(csSec.section);
  }

  // ACTIONS
  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.innerHTML =
    '<button id="saveBtn">Save</button>' +
    '<button id="exportBtn">Export</button>' +
    '<button id="importBtn">Import</button>' +
    '<button id="resetBtn">Reset</button>';
  body.appendChild(actions);
  document.getElementById('saveBtn').addEventListener('click', saveActivePreset);
  document.getElementById('exportBtn').addEventListener('click', exportPreset);
  document.getElementById('importBtn').addEventListener('click', importPreset);
  document.getElementById('resetBtn').addEventListener('click', () => {
    activePresetIndex = -1;
    applyConfig(DEFAULT_CONFIG);
  });

  updateSaveButton();
  updateActivePresetCard();
}

function createSection(title) {
  const section = document.createElement('div');
  section.className = 'section';
  const h = document.createElement('h2');
  h.innerHTML = title + '<span class="chev">▾</span>';
  h.addEventListener('click', () => section.classList.toggle('collapsed'));
  const controls = document.createElement('div');
  controls.className = 'controls';
  section.appendChild(h);
  section.appendChild(controls);
  return { section: section, controls: controls };
}

function createControl(group, item) {
  const row = document.createElement('div');
  row.className = (item.type === 'check' || item.type === 'select' || item.type === 'color')
    ? 'row row-wide' : 'row';

  const label = document.createElement('label');
  label.textContent = item.label;
  row.appendChild(label);

  if (item.type === 'range') {
    const input = document.createElement('input');
    input.type = 'range';
    input.min = item.min; input.max = item.max; input.step = item.step;
    input.value = config[group][item.key];
    const valueEl = document.createElement('div');
    valueEl.className = 'value';
    valueEl.textContent = formatValue(input.value, item.step);
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      config[group][item.key] = v;
      valueEl.textContent = formatValue(v, item.step);
      onConfigChange(group, item.key);
    });
    row.appendChild(input);
    row.appendChild(valueEl);
  } else if (item.type === 'check') {
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!config[group][item.key];
    input.addEventListener('change', () => {
      config[group][item.key] = input.checked;
      onConfigChange(group, item.key);
    });
    const wrap = document.createElement('div');
    wrap.appendChild(input);
    row.appendChild(wrap);
  } else if (item.type === 'select') {
    const sel = document.createElement('select');
    for (const opt of item.options) {
      const o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      sel.appendChild(o);
    }
    sel.value = config[group][item.key];
    sel.addEventListener('change', () => {
      config[group][item.key] = sel.value;
      onConfigChange(group, item.key);
    });
    row.appendChild(sel);
  } else if (item.type === 'color') {
    const input = document.createElement('input');
    input.type = 'color';
    input.value = config[group][item.key];
    input.addEventListener('input', () => {
      config[group][item.key] = input.value;
      onConfigChange(group, item.key);
    });
    row.appendChild(input);
  }
  return row;
}

function createCharsetRow(key) {
  const row = document.createElement('div');
  row.className = 'charset-row';

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = config.charset[key] > 0;

  const labelDiv = document.createElement('div');
  labelDiv.className = 'label-block';
  labelDiv.innerHTML = CHAR_LABELS[key].name + '<span class="preview">' + CHAR_LABELS[key].preview + '</span>';

  const slider = document.createElement('input');
  slider.type = 'range';
  slider.min = 0; slider.max = 1; slider.step = 0.01;
  slider.value = config.charset[key];

  const valueEl = document.createElement('div');
  valueEl.className = 'value';
  valueEl.textContent = parseFloat(config.charset[key]).toFixed(2);

  cb.addEventListener('change', () => {
    if (cb.checked) {
      const prev = charsetMemory[key];
      config.charset[key] = (prev && prev > 0) ? prev : 0.25;
    } else {
      if (config.charset[key] > 0) charsetMemory[key] = config.charset[key];
      config.charset[key] = 0;
    }
    slider.value = config.charset[key];
    valueEl.textContent = parseFloat(config.charset[key]).toFixed(2);
    renderer.field.assignChars();
    markDirty();
  });

  slider.addEventListener('input', () => {
    const v = parseFloat(slider.value);
    config.charset[key] = v;
    if (v > 0) charsetMemory[key] = v;
    valueEl.textContent = v.toFixed(2);
    cb.checked = v > 0;
    renderer.field.assignChars();
    markDirty();
  });

  row.appendChild(cb);
  row.appendChild(labelDiv);
  row.appendChild(slider);
  row.appendChild(valueEl);
  return row;
}

function formatValue(v, step) {
  v = parseFloat(v);
  if (step >= 1) return Math.round(v).toString();
  if (step >= 0.1) return v.toFixed(1);
  if (step >= 0.01) return v.toFixed(2);
  return v.toFixed(3);
}

function onConfigChange(group, key) {
  if (group === 'particles' && key === 'density') {
    renderer.field.rebuild();
  }
  markDirty();
}

function applyPreset(i) {
  const preset = PRESETS[i];
  if (!preset) return;
  activePresetIndex = i;
  applyConfig(preset.config);
}

function applyConfig(newConfig) {
  // deep merge into config
  config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  for (const k in newConfig) {
    if (typeof newConfig[k] === 'object' && newConfig[k] !== null) {
      config[k] = Object.assign({}, config[k], newConfig[k]);
    } else {
      config[k] = newConfig[k];
    }
  }
  // Sync charset memory with newly applied values so re-checking restores them
  for (const k of Object.keys(CHAR_GROUPS)) {
    if (config.charset[k] > 0) charsetMemory[k] = config.charset[k];
  }
  isDirty = false;
  buildPanel();
  renderer.field.rebuild();
}

// =============================================================
// MODAL: EXPORT / IMPORT
// =============================================================
function exportPreset() {
  const m = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = 'Export Preset';
  const out = {
    name: PRESETS[activePresetIndex] ? PRESETS[activePresetIndex].name + ' (custom)' : 'Custom Preset',
    config: config
  };
  const ta = document.getElementById('modalText');
  ta.value = JSON.stringify(out, null, 2);
  ta.readOnly = false;
  document.getElementById('modalApply').style.display = 'none';
  m.classList.add('show');
}

function importPreset() {
  const m = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = 'Import Preset';
  const ta = document.getElementById('modalText');
  ta.value = '';
  ta.placeholder = 'Paste preset JSON here...';
  ta.readOnly = false;
  document.getElementById('modalApply').style.display = '';
  m.classList.add('show');
}

document.getElementById('modalCopy').addEventListener('click', () => {
  const t = document.getElementById('modalText');
  t.select();
  try { navigator.clipboard.writeText(t.value); } catch (e) {}
  showToast('Copied');
});
document.getElementById('modalApply').addEventListener('click', () => {
  try {
    const data = JSON.parse(document.getElementById('modalText').value);
    if (data && data.config) applyConfig(data.config);
    else applyConfig(data);
    document.getElementById('modal').classList.remove('show');
    activePresetIndex = -1;
    showToast('Preset applied');
  } catch (e) {
    showToast('Invalid JSON');
  }
});
document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

// =============================================================
// MAIN
// =============================================================
const canvas = document.getElementById('bg');
const renderer = new Renderer(canvas);
renderer.resize();
window.addEventListener('resize', () => renderer.resize());

loadPersistedPresets();
buildPanel();
applyPreset(0);

// =============================================================
// URL PARAMS — for embedding (e.g. presenter-screen.html as iframe)
//   ?preset=<slug>     pick a preset by slugified name
//   ?nopanel=1         hide the designer panel + open-button
//   ?nohint=1          hide the keyboard hint
// =============================================================
(function applyUrlParams() {
  const params = new URLSearchParams(window.location.search);
  const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const presetSlug = params.get('preset');
  if (presetSlug) {
    const idx = PRESETS.findIndex(p => slugify(p.name) === presetSlug);
    if (idx >= 0) applyPreset(idx);
  }
  if (params.get('nopanel') === '1') {
    const panel = document.getElementById('panel');
    const openBtn = document.getElementById('showPanelBtn');
    if (panel) panel.classList.add('hidden');
    if (openBtn) openBtn.style.display = 'none';
  }
  if (params.get('nohint') === '1') {
    const hint = document.querySelector('.hint');
    if (hint) hint.style.display = 'none';
  }
})();

document.addEventListener('keydown', (e) => {
  if ((e.key === 'h' || e.key === 'H') && !isEditing(e.target)) {
    document.getElementById('panel').classList.toggle('hidden');
    document.getElementById('showPanelBtn').classList.toggle('show');
  }
  if (e.key === ' ' && !isEditing(e.target)) {
    paused = !paused;
    e.preventDefault();
  }
});
function isEditing(el) {
  if (!el) return false;
  const tag = (el.tagName || '').toLowerCase();
  return tag === 'input' || tag === 'textarea' || tag === 'select';
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('showPanelBtn').classList.add('show');
});
document.getElementById('showPanelBtn').addEventListener('click', () => {
  document.getElementById('panel').classList.remove('hidden');
  document.getElementById('showPanelBtn').classList.remove('show');
});

// loop
let lastTime = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (!paused) {
    renderer.time += dt;
    renderer.line.update(dt, renderer.time);
    const head = renderer.line.getHead();
    renderer.field.update(dt, renderer.time, head);
    if (config.style === 'constellation') {
      renderer.constellation.update(dt, renderer.time);
    } else if (config.style === 'sand') {
      renderer.sand.update(dt, renderer.time);
    }
  }
  renderer.draw();
  requestAnimationFrame(loop);
}
loop();
