<!doctype html>
<html lang="en" class="paper-mode">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440, initial-scale=1" />
<title>Noon Academy — Endless Canvas (Floating controls)</title>
<link rel="stylesheet" href="assets/colors_and_type.css" />
<style>
  .paper-mode { --paper-100:#fdfdfc; --paper-200:#f7f6f3; --paper-300:#efeeea; }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--paper-200); color:var(--fg); }

  .vp { position:fixed; inset:0; overflow:hidden; cursor:grab;
        background:
          radial-gradient(circle at 1px 1px, rgba(10,15,26,0.05) 1px, transparent 0) 0 0 / 28px 28px,
          linear-gradient(to bottom, var(--paper-200), var(--paper-100)); }
  .vp.grabbing { cursor:grabbing; }
  .world { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }

  /* the single slide */
  .slide { position:absolute; left:0; top:0; width:960px; height:540px; border-radius:10px; background:#fff;
           border:1px solid var(--border); box-shadow:0 24px 60px -22px rgba(10,15,26,0.32), 0 3px 10px rgba(10,15,26,0.06);
           overflow:hidden; cursor:pointer; }
  .slide.sel{ box-shadow:0 0 0 2px var(--accent), 0 24px 60px -22px rgba(10,15,26,0.32); }
  .slide__pad{ position:absolute; inset:0; padding:60px 70px; display:flex; flex-direction:column; }
  .slide__caps{ font-family:var(--font-sans); font-size:12px; letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--fg-faint); }
  .slide__caps b{ color:var(--fg-muted); font-weight:600; }
  .slide h1{ font-family:var(--font-serif); font-size:52px; font-weight:500; letter-spacing:-0.02em; line-height:1.02; color:var(--ink); margin-top:20px; max-width:18ch; }
  .slide h1 em{ font-style:italic; }
  .slide p{ margin-top:16px; font-family:var(--font-sans); font-size:16px; line-height:1.5; color:rgba(10,15,26,0.62); max-width:44ch; }
  .slide .eq{ margin-top:auto; font-family:var(--font-serif); font-style:italic; font-size:56px; color:var(--ink); }
  .slide .eq sup{ font-size:60%; }
  .slide__foot{ position:absolute; left:70px; right:70px; bottom:34px; display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--fg-faint); letter-spacing:0.05em; }

  /* floating instruments (shared language) */
  .fp{ position:fixed; z-index:20; background:var(--paper-100); border:1px solid var(--border); border-radius:12px;
       box-shadow:0 10px 30px -10px rgba(10,15,26,0.22), 0 2px 6px rgba(10,15,26,0.06); }
  [data-drag]{ cursor:grab; } [data-drag]:active{ cursor:grabbing; }
  .grip{ display:inline-flex; align-items:center; color:var(--fg-faint); }
  .grip svg{ width:6px; height:22px; }

  .fp-class{ top:18px; left:18px; display:flex; align-items:center; gap:12px; padding:10px 14px; }
  .fp-class .t{ font-family:var(--font-serif); font-size:15px; } .fp-class .dot{ width:6px;height:6px;border-radius:999px;background:var(--signal);box-shadow:0 0 0 4px rgba(201,162,39,0.18);animation:pulse 2.4s infinite; }
  .fp-class .timer{ font-family:var(--font-mono); font-size:13px; color:var(--gold-500); padding-left:12px; border-left:1px solid var(--border); }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  .fp-tools{ top:50%; left:18px; transform:translateY(-50%); display:flex; flex-direction:column; padding:6px; gap:4px; }
  .fp-tools__head{ height:14px; display:flex; align-items:center; justify-content:center; color:var(--fg-faint); } .fp-tools__head svg{ width:14px;height:5px; }
  .tbtn{ width:40px; height:40px; border-radius:8px; border:none; background:transparent; color:var(--fg-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .tbtn:hover{ background:var(--hover-overlay); color:var(--fg); } .tbtn.on{ background:var(--accent-soft); color:var(--accent); } .tbtn svg{ width:17px;height:17px; }
  .fp--collapsed .body{ display:none; }

  .fp-stage{ top:18px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; padding:8px 12px; }
  .fp-stage .count{ display:flex; flex-direction:column; align-items:center; font-family:var(--font-mono); font-size:11px; color:var(--terra); } .fp-stage .count svg{ width:13px;height:13px; }
  .av{ width:38px;height:38px;border-radius:999px;overflow:hidden;border:1px solid var(--border-strong);background:var(--paper-300);display:flex;align-items:center;justify-content:center; } .av img{ width:100%;height:100%;object-fit:cover; }
  .av--me{ box-shadow:0 0 0 2px var(--paper-100), 0 0 0 3px var(--terra-border); }
  .fp-stage .hand{ display:flex;flex-direction:column;align-items:center;gap:2px;height:40px;justify-content:center;padding:0 8px;border-radius:8px;background:var(--iris-soft);border:1px solid var(--iris-border);color:var(--iris);cursor:pointer; } .fp-stage .hand svg{ width:14px;height:14px; } .fp-stage .hand b{ font-family:var(--font-mono);font-size:9px; }

  .fp-chat{ right:18px; top:80px; width:290px; display:flex; flex-direction:column; max-height:64vh; }
  .fp-chat__head{ display:flex; align-items:center; justify-content:space-between; padding:11px 14px; border-bottom:1px solid var(--border); }
  .fp-chat__head b{ font-family:var(--font-sans); font-size:13px; font-weight:600; letter-spacing:var(--tracking-caps); text-transform:uppercase; }
  .fp-chat__msgs{ overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px; }
  .msg{ display:flex; gap:9px; } .msg .a{ width:26px;height:26px;border-radius:999px;flex:0 0 auto;overflow:hidden; } .msg .a img{width:100%;height:100%;object-fit:cover}
  .msg .n{ font-family:var(--font-sans); font-size:12px; font-weight:600; color:var(--fg-muted); } .msg .x{ font-family:var(--font-sans); font-size:13px; color:var(--fg); line-height:1.4; }
  .fp-chat__in{ display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--border); } .fp-chat__in input{ flex:1; border:1px solid var(--border-strong); border-radius:6px; padding:7px 10px; font-size:13px; outline:none; background:#fff; }
  .fp-chat.fp--collapsed{ width:auto; max-height:none; } .fp-chat.fp--collapsed .fp-pane{ display:none; } .fp-chat.fp--collapsed .fp-chat__head{ border-bottom:none; }
  .iconbtn{ width:26px;height:26px;border:none;background:transparent;color:var(--fg-faint);cursor:pointer;border-radius:6px;display:inline-flex;align-items:center;justify-content:center; } .iconbtn:hover{ background:var(--hover-overlay);color:var(--fg-muted); } .iconbtn svg{ width:15px;height:15px; }

  /* filmstrip (slide nav) */
  .fp-film{ left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; padding:8px 10px; max-width:70vw; }
  .fp-film .grip{ margin-right:2px; }
  .fp-film__row{ display:flex; align-items:center; gap:10px; height:64px; flex:1 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; }
  .fp-film__row::-webkit-scrollbar{ height:0; width:0; display:none; }
  .thumb{ flex:0 0 auto; width:96px; height:54px; border-radius:5px; background:#fff; border:1px solid var(--border-strong); cursor:pointer; position:relative; overflow:hidden; }
  .thumb.on{ box-shadow:0 0 0 2px var(--accent); border-color:var(--accent); }
  .thumb .tt{ position:absolute; inset:0; padding:7px 8px; }
  .thumb .tt .h{ height:5px; width:60%; background:rgba(10,15,26,0.28); border-radius:2px; }
  .thumb .tt .l{ height:3px; margin-top:5px; background:rgba(10,15,26,0.12); border-radius:2px; } .thumb .tt .l.s{ width:70%; }
  .thumb .tt .e{ position:absolute; left:8px; bottom:7px; font-family:var(--font-serif); font-style:italic; font-size:11px; color:var(--ink); }
  .thumb__n{ position:absolute; right:5px; bottom:4px; font-family:var(--font-mono); font-size:8px; color:var(--fg-faint); }

  /* zoom control */
  .fp-zoom{ right:18px; bottom:18px; display:flex; align-items:center; gap:2px; padding:5px; }
  .fp-zoom button{ height:34px; min-width:34px; padding:0 10px; border:none; background:transparent; color:var(--fg-muted); cursor:pointer; border-radius:8px; font-family:var(--font-mono); font-size:13px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .fp-zoom button:hover{ background:var(--hover-overlay); color:var(--fg); } .fp-zoom .sep{ width:1px;height:20px;background:var(--border);margin:0 2px; } .fp-zoom svg{ width:16px;height:16px; }

  /* minimap */
  .fp-map__c{ position:relative; width:100%; height:100%; background:var(--paper-300); border-radius:6px; overflow:hidden; cursor:pointer; }
  .mm-slide{ position:absolute; background:#fff; border:1px solid var(--border-strong); border-radius:2px; }
  .mm-view{ position:absolute; border:1.5px solid var(--accent); background:rgba(42,138,106,0.08); border-radius:2px; pointer-events:none; }

  /* contextual toolbar */
  .ctx{ position:fixed; z-index:25; display:none; align-items:center; gap:2px; padding:4px; background:var(--paper-100); border:1px solid var(--border-strong); border-radius:10px; box-shadow:0 8px 24px -8px rgba(10,15,26,0.28); }
  .ctx.show{ display:flex; }
  .ctx button{ height:32px; padding:0 12px; border:none; background:transparent; color:var(--fg-muted); cursor:pointer; border-radius:7px; font-family:var(--font-sans); font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .ctx button:hover{ background:var(--hover-overlay); color:var(--fg); } .ctx button.primary{ background:var(--accent); color:var(--accent-fg); } .ctx button.primary:hover{ background:var(--accent-hover); }
  .ctx svg{ width:14px;height:14px; } .ctx .sep{ width:1px;height:20px;background:var(--border);margin:0 3px; }

  .hint{ position:fixed; top:18px; right:320px; font-family:var(--font-mono); font-size:10px; color:var(--fg-faint); z-index:5; }
  /* ported: chat lock + raised-hands popover */
  #chatlock.on{ color:var(--accent); }
  .fp-chat__in.locked input{ background:var(--paper-300); color:var(--fg-faint); cursor:not-allowed; }
  .rhpop{ position:fixed; z-index:30; width:300px; background:var(--paper-100); border:1px solid var(--border); border-radius:12px; box-shadow:0 14px 36px -12px rgba(10,15,26,0.3); padding:12px; }
  .rhpop[hidden]{ display:none; }
  .rhpop__lower{ width:100%; height:38px; border:1px solid var(--border-strong); border-radius:999px; background:transparent; font-family:var(--font-sans); font-size:13px; font-weight:600; color:var(--fg); cursor:pointer; }
  .rhpop__lower:hover{ background:var(--hover-overlay); }
  .rhpop__t{ font-family:var(--font-sans); font-size:12px; font-weight:700; color:var(--fg); margin:12px 2px 4px; }
  .rhrow{ display:grid; grid-template-columns:34px 1fr auto; align-items:center; gap:10px; padding:6px 2px; }
  .rhav{ width:34px;height:34px;border-radius:999px;background:var(--paper-300);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-weight:600;font-size:13px;color:var(--fg-muted); }
  .rhn{ font-family:var(--font-sans);font-size:14px;font-weight:500;color:var(--fg); }
  .rhs{ font-family:var(--font-sans);font-size:11px;color:var(--fg-muted); }
  .rhup{ width:32px;height:32px;border-radius:999px;background:var(--iris-soft);border:1px solid var(--iris-border);color:var(--iris);cursor:pointer;display:inline-flex;align-items:center;justify-content:center; }
  .rhup:hover{ background:rgba(142,99,224,0.16); } .rhup svg{ width:15px;height:15px; }
  /* ported: media controls + annotation popovers */
  .tbtn--off{ background:var(--danger-soft); color:var(--danger); }
  .tbtn .ic-off{ display:none; } .tbtn.tbtn--off .ic-on{ display:none; } .tbtn.tbtn--off .ic-off{ display:inline-flex; }
  .trow-sep{ height:1px; background:var(--border); margin:3px 6px; }
  .swatch{ width:16px;height:16px;border-radius:999px;background:var(--ink);box-shadow:0 0 0 2px var(--paper-100),0 0 0 3px var(--border-strong); }
  .av--me{ position:relative; overflow:visible; }
  .av--me .av-img{ width:100%;height:100%;object-fit:cover;border-radius:999px; }
  .av--me .av-init{ display:none; width:100%;height:100%;align-items:center;justify-content:center; }
  .av--me.cam-off .av-img{ display:none; } .av--me.cam-off .av-init{ display:flex; }
  .av-mic{ position:absolute;bottom:-2px;right:-2px;width:15px;height:15px;border-radius:999px;background:#fff;border:1px solid var(--danger-border);color:var(--danger);display:none;align-items:center;justify-content:center; } .av--me.mic-off .av-mic{ display:inline-flex; } .av-mic svg{ width:8px;height:8px; }
  .railpop{ position:fixed; z-index:40; width:184px; background:var(--paper-100); border:1px solid var(--border); border-radius:10px; box-shadow:0 14px 34px -12px rgba(10,15,26,0.3); padding:12px; }
  .railpop[hidden]{ display:none; }
  .railpop__l{ font-family:var(--font-sans); font-size:10px; letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--fg-faint); margin:2px 2px 8px; }
  .railpop__r{ display:flex; gap:9px; margin-bottom:12px; flex-wrap:wrap; }
  .cdot{ width:24px;height:24px;border-radius:999px;border:none;cursor:pointer;padding:0; } .cdot.sel{ box-shadow:0 0 0 2px var(--paper-100),0 0 0 4px var(--fg-muted); }
  .sbtn{ width:38px;height:28px;border-radius:6px;background:transparent;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center; } .sbtn.sel{ border-color:var(--accent);background:var(--accent-soft); } .sbtn i{ display:block;width:22px;border-radius:999px;background:var(--ink); }
  .sgrid{ display:grid;grid-template-columns:repeat(3,1fr);gap:8px; } .shbtn{ width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--fg-muted);cursor:pointer;display:flex;align-items:center;justify-content:center; } .shbtn.sel{ border-color:var(--accent);background:var(--accent-soft);color:var(--accent); } .shbtn svg{ width:18px;height:18px; }
  /* ported: participants panel */
  .fp-part{ right:18px; bottom:90px; width:320px; max-height:70vh; display:flex; flex-direction:column; }
  .fp-part[hidden]{ display:none; }
  .fp-part__head{ display:flex; align-items:center; justify-content:space-between; padding:11px 14px; border-bottom:1px solid var(--border); }
  .fp-part__head b{ font-family:var(--font-sans); font-size:13px; font-weight:600; letter-spacing:var(--tracking-caps); text-transform:uppercase; }
  .fp-part__body{ overflow-y:auto; padding:4px 10px 12px; }
  .col-head{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; background:transparent; border:none; cursor:pointer; text-align:left; font-family:var(--font-sans); color:var(--fg); padding:10px 4px; }
  .col-head .chev{ color:var(--fg-faint); transition:transform var(--dur-2) var(--ease); flex:0 0 auto; }
  .collapsible.open > .col-head .chev{ transform:rotate(180deg); }
  .collapsible > .cbody{ display:none; } .collapsible.open > .cbody{ display:block; }
  .pgroup__h{ font-size:15px; font-weight:600; }
  .classroom{ border-top:1px solid var(--divider); } .classroom:first-child{ border-top:none; }
  .classroom__h{ font-size:14px; color:var(--fg-muted); font-weight:500; }
  .cl-feed{ position:relative; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
  .cl-feed img{ display:block; width:100%; height:120px; object-fit:cover; }
  .view-st{ justify-content:center; gap:6px; font-size:13px; font-weight:600; color:var(--fg-muted); }
  .team{ border:1px solid var(--border); border-radius:8px; padding:8px; margin:8px 0; background:var(--paper-100); }
  .team__h{ display:flex; align-items:center; gap:8px; padding:2px 4px 7px; border-bottom:1px solid var(--divider); margin-bottom:5px; font-family:var(--font-sans); font-size:12px; font-weight:600; color:var(--fg-muted); }
  .team__h img{ width:22px; height:22px; border-radius:6px; }
  .prow{ display:grid; grid-template-columns:30px 1fr auto; align-items:center; gap:10px; padding:5px 4px; }
  .prow__a{ width:30px;height:30px;border-radius:999px;background:var(--paper-300);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-weight:600;font-size:12px;color:var(--fg-muted); }
  .prow__n{ font-family:var(--font-sans);font-size:13px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
  .prow__a.arabic, .prow__n.arabic{ font-family:var(--font-arabic); }
  .prow__up{ width:28px;height:28px;border-radius:999px;background:var(--iris-soft);border:1px solid var(--iris-border);color:var(--iris);cursor:pointer;display:inline-flex;align-items:center;justify-content:center; } .prow__up svg{ width:14px;height:14px; }
  /* ported: stage view gallery */
  .sv-overlay{ position:fixed; inset:0; z-index:15; background:var(--paper-200); display:none; align-items:center; justify-content:space-evenly; gap:4vw; padding:4vh 6vw; }
  .sv-overlay.on{ display:flex; }
  .sv-body{ display:flex; align-items:center; gap:5vw; }
  .sv-close{ position:fixed; top:18px; right:18px; z-index:16; width:40px; height:40px; border-radius:999px; background:var(--paper-100); border:1px solid var(--border-strong); color:var(--fg-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(10,15,26,0.12); } .sv-close svg{ width:18px; height:18px; }
  .svt{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .svt__wrap{ position:relative; width:min(32vh,300px); height:min(32vh,300px); }
  .svt__img{ width:100%;height:100%;border-radius:999px;object-fit:cover;border:1px solid var(--border-strong);box-shadow:0 8px 28px -8px rgba(10,15,26,0.25); }
  .svt__init{ display:none; width:100%;height:100%;border-radius:999px;background:var(--paper-300);border:1px solid var(--border-strong);align-items:center;justify-content:center;font-family:var(--font-serif);font-size:100px;font-weight:500;color:var(--fg-muted); }
  .svt.cam-off .svt__img{ display:none; } .svt.cam-off .svt__init{ display:flex; }
  .svt__mic{ position:absolute;bottom:14px;right:14px;width:34px;height:34px;border-radius:999px;background:#fff;border:1px solid var(--danger-border);color:var(--danger);display:none;align-items:center;justify-content:center; } .svt.mic-off .svt__mic{ display:flex; } .svt__mic svg{ width:16px;height:16px; }
  .svt__name{ font-family:var(--font-serif);font-size:24px;color:var(--ink); } .svt__role{ font-family:var(--font-sans);font-size:11px;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-faint);margin-top:3px;text-align:center; }
  .sv-rooms{ display:grid; grid-template-columns:repeat(2,1fr); gap:30px 44px; }
  .sv-room{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .sv-room__t{ position:relative; width:130px; height:130px; }
  .sv-room__t img{ width:100%;height:100%;border-radius:999px;object-fit:cover;border:1px solid var(--border-strong); }
  .sv-room__mic{ position:absolute;bottom:4px;right:4px;width:26px;height:26px;border-radius:999px;background:#fff;border:1px solid var(--danger-border);color:var(--danger);display:flex;align-items:center;justify-content:center; } .sv-room__mic svg{ width:12px;height:12px; }
  .sv-room__nm{ font-family:var(--font-sans);font-size:14px;font-weight:600;color:var(--fg); } .sv-room__cl{ font-family:var(--font-sans);font-size:11px;color:var(--fg-faint); }
  /* merged chat + participants tabs */
  .fp-panel__head{ display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-bottom:1px solid var(--border); }
  .fp-tabs{ display:flex; gap:2px; }
  .fp-tab{ padding:7px 11px; border:none; background:transparent; border-radius:7px; font-family:var(--font-sans); font-size:11px; font-weight:600; letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--fg-faint); cursor:pointer; }
  .fp-tab:hover{ color:var(--fg-muted); } .fp-tab.on{ color:var(--fg); background:var(--paper-300); }
  .fp-panel__act{ display:flex; gap:2px; }
  .fp-pane{ display:flex; flex-direction:column; min-height:0; flex:1; }
  .fp-pane[hidden]{ display:none; }
  .fp-pane[data-pane="part"] .fp-part__body{ flex:1; }
  .fp-chat.fp--collapsed .fp-panel__head{ border-bottom:none; }
  .fp-panel__l{ display:flex; align-items:center; gap:6px; }
  body.sv-active .fp-film{ display:none; }
  body.sv-active .fp-zoom{ display:none; }
  body.sv-active .fp-stage .count, body.sv-active .fp-stage .av, body.sv-active .fp-stage .grip{ display:none; }
  .fp-tab .tab-lock{ margin-left:5px; display:inline-flex; vertical-align:-2px; color:var(--accent); } .fp-tab .tab-lock[hidden]{ display:none; } .fp-tab .tab-lock svg{ width:12px; height:12px; }

  /* ===== Breakout activity ===== */
  .cover-page{ position:absolute; inset:0; overflow:hidden; display:flex; align-items:center; justify-content:center; }

<script>
(function(){
  var vp=document.getElementById('vp'), world=document.getElementById('world'), slideEl=document.getElementById('slide');
  var SW=960, SH=540, tx=0, ty=0, scale=1;
  var SLIDES=[
    {n:'01',caps:'SLIDE 01 / 12 · WHY CIRCLES?',h1:'Trigonometry begins on a <em>circle</em>.',p:'Angles are hard to compare. Put one at the centre of a circle of radius 1, and every angle becomes a pair of coordinates we can measure.'},
    {n:'03',caps:'SLIDE 03 / 12 · THE PYTHAGOREAN IDENTITY',h1:'The unit circle is a <em>compass</em>.',eq:'sin<sup>2</sup>θ + cos<sup>2</sup>θ = 1'},
    {n:'08',caps:'SLIDE 08 / 12 · RECIPROCAL IDENTITIES',h1:'Every ratio has a <em>reciprocal</em>.',eq:'sec θ = 1 ⁄ cos θ'},
    {n:'09',caps:'SLIDE 09 / 12 · QUOTIENT IDENTITY',h1:'Tangent is a <em>quotient</em>.',eq:'tan θ = sin θ ⁄ cos θ'}
  ];
  var cur=1;
  function render(){
    var s=SLIDES[cur];
    var inner='<div class="slide__pad"><div class="slide__caps">'+s.caps+'</div><h1>'+s.h1+'</h1>';
    if(s.p) inner+='<p>'+s.p+'</p>';
    if(s.eq) inner+='<div class="eq">'+s.eq+'</div>';
    inner+='</div><div class="slide__foot"><span>NOON ACADEMY · GRADE 11 · MATH</span><span>FIG. '+s.n+'</span></div>';
    slideEl.innerHTML=inner;
    document.querySelectorAll('.thumb').forEach(function(t){ var di=t.getAttribute('data-i'); t.classList.toggle('on', di!==null && parseInt(di,10)===cur); });
    var pl=document.getElementById('pg-label'); if(pl) pl.textContent=(cur+1)+' / '+SLIDES.length;
  }
  function clampS(v){ return Math.max(0.35, Math.min(3, v)); }
  function apply(){ world.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'; document.getElementById('z-pct').textContent=Math.round(scale*100)+'%'; positionCtx(); drawMinimap(); }

  var panning=false,sx,sy,otx,oty;
  vp.addEventListener('pointerdown',function(e){ if(e.target.closest('.fp,.slide,.ctx')) return; panning=true; vp.classList.add('grabbing'); sx=e.clientX;sy=e.clientY;otx=tx;oty=ty; vp.setPointerCapture(e.pointerId); select(false); });
  vp.addEventListener('pointermove',function(e){ if(panning){ tx=otx+(e.clientX-sx); ty=oty+(e.clientY-sy); apply(); } });
  vp.addEventListener('pointerup',function(){ panning=false; vp.classList.remove('grabbing'); });
  vp.addEventListener('wheel',function(e){ e.preventDefault(); var r=vp.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top; var ns=clampS(scale*(e.deltaY<0?1.12:0.89)),k=ns/scale; tx=mx-(mx-tx)*k; ty=my-(my-ty)*k; scale=ns; apply(); },{passive:false});
  vp.addEventListener('dblclick',function(e){ if(!e.target.closest('.fp,.slide,.ctx')) fit(); });

  function tween(nx,ny,ns){ var ox=tx,oy=ty,os=scale,t0=performance.now(); function f(now){ var k=Math.min(1,(now-t0)/400),e=1-Math.pow(1-k,3); tx=ox+(nx-ox)*e; ty=oy+(ny-oy)*e; scale=os+(ns-os)*e; apply(); if(k<1) requestAnimationFrame(f);} requestAnimationFrame(f); }
  function fit(){ var pad=document.body.classList.contains('focus-mode')?30:90, vw=vp.clientWidth, vh=vp.clientHeight; var ns=clampS(Math.min((vw-pad*2)/SW,(vh-pad*2)/SH)); tween(vw/2-(SW/2)*ns, vh/2-(SH/2)*ns, ns); }

  slideEl.addEventListener('click',function(e){ e.stopPropagation(); select(true); });
  function select(on){ slideEl.classList.toggle('sel',on); document.getElementById('ctx').classList.toggle('show',on); if(!on && window.__setAnnoTool) window.__setAnnoTool(null); apply(); }
  window.__select=select; window.__fit=fit;
  window.__page=function(d){ cur=Math.max(0,Math.min(SLIDES.length-1, cur+d)); render(); fit(); };
  function positionCtx(){ if(!slideEl.classList.contains('sel')) return; var ctx=document.getElementById('ctx'); ctx.style.left=((SW/2)*scale+tx)+'px'; ctx.style.top=(ty-46)+'px'; ctx.style.transform='translateX(-50%)'; }

  function zoomBtn(f){ var mx=vp.clientWidth/2,my=vp.clientHeight/2,ns=clampS(scale*f),k=ns/scale; tx=mx-(mx-tx)*k; ty=my-(my-ty)*k; scale=ns; apply(); }
  document.getElementById('z-in').onclick=function(){ zoomBtn(1.15); };
  document.getElementById('z-out').onclick=function(){ zoomBtn(0.87); };
  document.getElementById('z-fit').onclick=fit;

  /* filmstrip */
  document.getElementById('film').innerHTML=SLIDES.map(function(s,i){
    var tt = s.eq ? '<div class="tt"><div class="h"></div><div class="e">'+s.eq+'</div></div>' : '<div class="tt"><div class="h"></div><div class="l"></div><div class="l s"></div></div>';
    return '<div class="thumb" data-i="'+i+'">'+tt+'<span class="thumb__n">'+s.n+'</span></div>';
  }).join('');
  document.querySelectorAll('.thumb').forEach(function(t){ t.addEventListener('click',function(){ cur=parseInt(t.getAttribute('data-i'),10); render(); fit(); }); });

  /* minimap removed in floating model — single slide, Fit button covers recenter */
  var mm=document.getElementById('mm'), mmSlide=document.getElementById('mm-slide'), mmView=document.getElementById('mm-view');
  function drawMinimap(){
    if(!mm) return;
    /* show the slide region + the current viewport over it (world coords 0..SW, 0..SH plus margins) */
    var mw=mm.clientWidth, mh=mm.clientHeight, pad=8;
    var bw=SW+400, bh=SH+300, bx=-200, by=-150;
    var k=Math.min((mw-pad*2)/bw,(mh-pad*2)/bh);
    var ox=pad+(mw-pad*2-bw*k)/2, oy=pad+(mh-pad*2-bh*k)/2;
    mmSlide.style.left=(ox+(0-bx)*k)+'px'; mmSlide.style.top=(oy+(0-by)*k)+'px'; mmSlide.style.width=(SW*k)+'px'; mmSlide.style.height=(SH*k)+'px';
    var vx=-tx/scale, vy=-ty/scale, vw=vp.clientWidth/scale, vh=vp.clientHeight/scale;
    mmView.style.left=(ox+(vx-bx)*k)+'px'; mmView.style.top=(oy+(vy-by)*k)+'px'; mmView.style.width=(vw*k)+'px'; mmView.style.height=(vh*k)+'px';
  }
  if(mm) mm.addEventListener('click',function(e){
    var mw=mm.clientWidth, mh=mm.clientHeight, pad=8, bw=SW+400, bh=SH+300, bx=-200, by=-150;
    var k=Math.min((mw-pad*2)/bw,(mh-pad*2)/bh), ox=pad+(mw-pad*2-bw*k)/2, oy=pad+(mh-pad*2-bh*k)/2;
    var r=mm.getBoundingClientRect(); var wx=bx+(e.clientX-r.left-ox)/k, wy=by+(e.clientY-r.top-oy)/k;
    tween(vp.clientWidth/2-wx*scale, vp.clientHeight/2-wy*scale, scale);
  });

  /* floating panel drag + collapse */
  document.querySelectorAll('.fp').forEach(function(fp){ var g=fp.querySelector('[data-drag]'); if(!g) return;
    g.addEventListener('pointerdown',function(e){ if(e.target.closest('button,input,.fp-tab')) return; var r=fp.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top, started=false;
      function mv(ev){ if(!started){ started=true; fp.style.transform='none'; fp.style.left=r.left+'px'; fp.style.top=r.top+'px'; fp.style.right='auto'; fp.style.bottom='auto'; } fp.style.left=(ev.clientX-ox)+'px'; fp.style.top=(ev.clientY-oy)+'px'; }
      function up(){ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); }
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    });
  });
  document.querySelectorAll('[data-collapse]').forEach(function(b){ b.addEventListener('click',function(){ b.closest('.fp').classList.toggle('fp--collapsed'); }); });

  var CH=[['احمد جمال','assets/classroom-a.jpg','Thanks, mam — that helped'],['Jannat Fatima','assets/classroom-b.jpg','The unit circle part is clear now'],['Sara Khalid','assets/classroom-d.jpg','Can we get this as PDF?']];
  document.getElementById('chat-msgs').innerHTML=CH.map(function(m){ return '<div class="msg"><div class="a"><img src="'+m[1]+'"></div><div><div class="n">'+m[0]+'</div><div class="x">'+m[2]+'</div></div></div>'; }).join('');

  render(); fit();
  /* ---- ported: chat lock ---- */
  (function(){
    var cl=document.getElementById('chatlock'), ci=document.querySelector('.fp-chat__in input'), cw=document.querySelector('.fp-chat__in'); var locked=false;
    if(cl&&ci&&cw){ cl.addEventListener('click', function(e){ e.stopPropagation(); locked=!locked; cl.classList.toggle('on',locked); ci.disabled=locked; cw.classList.toggle('locked',locked); ci.placeholder=locked?'Chat is locked':'Write a message…'; var ti=document.querySelector('.fp-tab[data-tab="chat"] .tab-lock'); var onPart=document.querySelector('.fp-tab[data-tab="part"]').classList.contains('on'); if(ti) ti.hidden=!(locked&&onPart); }); }
  })();
  /* ---- ported: raised-hands popover ---- */
  (function(){
    var hand=document.querySelector('.fp-stage .hand'); if(!hand) return;
    var UP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
    var hands=[['Laiba Suleman','Grade 11, Classroom A'],['Amr Mohammed','Grade 11, Classroom A'],['Sara Khalid','Grade 10, Classroom B']];
    var pop=document.createElement('div'); pop.className='rhpop'; pop.hidden=true;
    pop.innerHTML='<button class="rhpop__lower">Lower all hands</button><div class="rhpop__t">Raised Hands ('+hands.length+')</div>'+hands.map(function(h){ return '<div class="rhrow"><div class="rhav">'+h[0].charAt(0)+'</div><div><div class="rhn">'+h[0]+'</div><div class="rhs">'+h[1]+'</div></div><button class="rhup">'+UP+'</button></div>'; }).join('');
    document.body.appendChild(pop);
    hand.style.cursor='pointer';
    hand.addEventListener('click', function(e){ e.stopPropagation(); if(pop.hidden){ var r=hand.getBoundingClientRect(); pop.style.left=Math.max(12,Math.min(window.innerWidth-312, r.left-130))+'px'; pop.style.top=(r.bottom+10)+'px'; pop.hidden=false; } else pop.hidden=true; });
    document.addEventListener('click', function(e){ if(!pop.hidden && !pop.contains(e.target) && !hand.contains(e.target)) pop.hidden=true; });
    pop.addEventListener('click', function(e){ if(e.target.closest('.rhpop__lower')||e.target.closest('.rhup')) pop.hidden=true; });
  })();
  /* ---- ported: mic / camera ---- */
  (function(){
    var mic=document.getElementById('mic-tool'), cam=document.getElementById('cam-tool'), tav=document.getElementById('t-av');
    var micOn=true, camOn=true;
    function sMic(){ mic.classList.toggle('tbtn--off',!micOn); mic.classList.toggle('on',micOn); mic.setAttribute('aria-label',micOn?'Microphone on':'Microphone off'); if(tav) tav.classList.toggle('mic-off',!micOn); }
    function sCam(){ cam.classList.toggle('tbtn--off',!camOn); cam.classList.toggle('on',camOn); cam.setAttribute('aria-label',camOn?'Camera on':'Camera off'); if(tav) tav.classList.toggle('cam-off',!camOn); }
    if(mic){ mic.addEventListener('click',function(){ micOn=!micOn; sMic(); }); sMic(); }
    if(cam){ cam.addEventListener('click',function(){ camOn=!camOn; sCam(); }); sCam(); }
    var sh=document.getElementById('share-tool'); if(sh){ sh.addEventListener('click',function(){ var on=sh.classList.toggle('on'); sh.setAttribute('aria-label', on?'Stop sharing screen':'Share screen'); }); }
  })();
  /* ---- ported: pen colour/stroke + shapes popovers ---- */
  (function(){
    function mk(){ var d=document.createElement('div'); d.className='railpop'; d.hidden=true; document.body.appendChild(d); return d; }
    function place(btn,p){ var r=btn.getBoundingClientRect(); p.style.left=Math.max(12,Math.min(window.innerWidth-196, r.left))+'px'; p.style.top=(r.bottom+8)+'px'; }
    var penBtn=document.getElementById('pen-opts'), sw=document.getElementById('swatch');
    if(penBtn){
      var pp=mk(), colors=['#0a0f1a','#c55a4e','#2A8A6A','#8E63E0','#c9a227','#6BA3FF'], strokes=[2,4,7], cc=colors[0], cs=4;
      function bp(){ pp.innerHTML='<div class="railpop__l">Colour</div><div class="railpop__r">'+colors.map(function(c){return '<button class="cdot'+(c===cc?' sel':'')+'" data-c="'+c+'" style="background:'+c+'"></button>';}).join('')+'</div><div class="railpop__l">Stroke</div><div class="railpop__r" style="margin-bottom:0">'+strokes.map(function(w){return '<button class="sbtn'+(w===cs?' sel':'')+'" data-w="'+w+'"><i style="height:'+w+'px"></i></button>';}).join('')+'</div>'; if(sw) sw.style.background=cc; window.__anno=window.__anno||{color:'#0a0f1a',stroke:4,shape:'square'}; window.__anno.color=cc; window.__anno.stroke=cs; }
      bp();
      penBtn.addEventListener('click',function(e){ e.stopPropagation(); if(pp.hidden){ place(penBtn,pp); pp.hidden=false; } else pp.hidden=true; });
      pp.addEventListener('click',function(e){ var c=e.target.closest('.cdot'); if(c){cc=c.getAttribute('data-c');bp();return;} var w=e.target.closest('.sbtn'); if(w){cs=parseInt(w.getAttribute('data-w'),10);bp();return;} });
      document.addEventListener('click',function(e){ if(!pp.hidden&&!pp.contains(e.target)&&!penBtn.contains(e.target)) pp.hidden=true; });
    }
    var shBtn=document.getElementById('shape-opts');
    if(shBtn){
      var sp=mk(), SH=[['square','<rect x="4" y="4" width="16" height="16" rx="2"/>'],['circle','<circle cx="12" cy="12" r="9"/>'],['triangle','<path d="M12 4 L21 20 L3 20 Z"/>'],['diamond','<path d="M12 3 L21 12 L12 21 L3 12 Z"/>'],['line','<line x1="5" y1="19" x2="19" y2="5"/>'],['arrow','<line x1="5" y1="19" x2="19" y2="5"/><polyline points="11 5 19 5 19 13"/>']], curS='square';
      function bs(){ sp.innerHTML='<div class="railpop__l">Shape</div><div class="sgrid">'+SH.map(function(x){return '<button class="shbtn'+(x[0]===curS?' sel':'')+'" data-s="'+x[0]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+x[1]+'</svg></button>';}).join('')+'</div>'; }
      bs();
      shBtn.addEventListener('click',function(e){ e.stopPropagation(); if(sp.hidden){ place(shBtn,sp); sp.hidden=false; } else sp.hidden=true; });
      sp.addEventListener('click',function(e){ var b=e.target.closest('.shbtn'); if(!b) return; curS=b.getAttribute('data-s'); window.__anno=window.__anno||{}; window.__anno.shape=curS; bs(); sp.hidden=true; if(window.__setAnnoTool) window.__setAnnoTool('shape'); });
      document.addEventListener('click',function(e){ if(!sp.hidden&&!sp.contains(e.target)&&!shBtn.contains(e.target)) sp.hidden=true; });
    }
  })();
  /* ---- annotation: real drawing / erasing ---- */
  (function(){
    var anno=document.getElementById('anno'); if(!anno) return;
    var NS='http://www.w3.org/2000/svg';
    window.__anno=window.__anno||{color:'#0a0f1a',stroke:4,shape:'square'}; window.__anno.tool=null;
    var hist=[], redo=[], eraseBatch=[], drawing=false, cur=null, start=null;
    function color(){ return window.__anno.color||'#0a0f1a'; }
    function width(){ return window.__anno.stroke||4; }
    function shapeType(){ return window.__anno.shape||'square'; }

    var penBtn=document.getElementById('pen-tool'), erBtn=document.getElementById('eraser-tool'), shBtn=document.getElementById('shape-opts');
    function setTool(t){
      if(window.__anno.tool===t) t=null;
      window.__anno.tool=t;
      [penBtn,erBtn,shBtn].forEach(function(b){ if(b) b.classList.remove('on'); });
      if(t==='pen'&&penBtn) penBtn.classList.add('on');
      else if(t==='eraser'&&erBtn) erBtn.classList.add('on');
      else if(t==='shape'&&shBtn) shBtn.classList.add('on');
      anno.classList.toggle('active', !!t);
      anno.style.cursor = t==='eraser' ? 'cell' : (t?'crosshair':'');
    }
    window.__setAnnoTool=setTool;
    if(penBtn) penBtn.addEventListener('click', function(){ setTool('pen'); });
    if(erBtn) erBtn.addEventListener('click', function(){ setTool('eraser'); });
    if(shBtn) shBtn.addEventListener('click', function(){ if(window.__anno.tool!=='shape') setTool('shape'); });

    function pt(e){ var r=anno.getBoundingClientRect(); return { x:(e.clientX-r.left)*960/r.width, y:(e.clientY-r.top)*540/r.height }; }
    function style(el){ el.setAttribute('fill','none'); el.setAttribute('stroke',color()); el.setAttribute('stroke-width',width()); el.setAttribute('stroke-linecap','round'); el.setAttribute('stroke-linejoin','round'); return el; }
    function makeShape(type,x0,y0,x1,y1){
      var minx=Math.min(x0,x1),miny=Math.min(y0,y1),w=Math.abs(x1-x0),h=Math.abs(y1-y0),mx=(x0+x1)/2,my=(y0+y1)/2,el;
      if(type==='circle'){ el=document.createElementNS(NS,'ellipse'); el.setAttribute('cx',mx); el.setAttribute('cy',my); el.setAttribute('rx',w/2); el.setAttribute('ry',h/2); }
      else if(type==='triangle'){ el=document.createElementNS(NS,'path'); el.setAttribute('d','M'+mx+' '+miny+' L'+(minx+w)+' '+(miny+h)+' L'+minx+' '+(miny+h)+' Z'); }
      else if(type==='diamond'){ el=document.createElementNS(NS,'path'); el.setAttribute('d','M'+mx+' '+miny+' L'+(minx+w)+' '+my+' L'+mx+' '+(miny+h)+' L'+minx+' '+my+' Z'); }
      else if(type==='line'){ el=document.createElementNS(NS,'line'); el.setAttribute('x1',x0); el.setAttribute('y1',y0); el.setAttribute('x2',x1); el.setAttribute('y2',y1); }
      else if(type==='arrow'){ el=document.createElementNS(NS,'path'); var a=Math.atan2(y1-y0,x1-x0),k=16; el.setAttribute('d','M'+x0+' '+y0+' L'+x1+' '+y1+' M'+(x1-k*Math.cos(a-0.5))+' '+(y1-k*Math.sin(a-0.5))+' L'+x1+' '+y1+' L'+(x1-k*Math.cos(a+0.5))+' '+(y1-k*Math.sin(a+0.5))); }
      else { el=document.createElementNS(NS,'rect'); el.setAttribute('x',minx); el.setAttribute('y',miny); el.setAttribute('width',w); el.setAttribute('height',h); el.setAttribute('rx',6); }
      return style(el);
    }
    function hitTest(el,p,R){
      try{ var len=el.getTotalLength?el.getTotalLength():0; if(len){ var step=Math.max(2,len/40); for(var d=0;d<=len;d+=step){ var q=el.getPointAtLength(d); if(Math.hypot(q.x-p.x,q.y-p.y)<=R) return true; } return false; } }catch(_){}
      var b=el.getBBox(); return p.x>=b.x-R&&p.x<=b.x+b.width+R&&p.y>=b.y-R&&p.y<=b.y+b.height+R;
    }
    function eraseAt(p){ Array.prototype.slice.call(anno.children).forEach(function(el){ if(hitTest(el,p,16)){ anno.removeChild(el); eraseBatch.push(el); } }); }

    anno.addEventListener('pointerdown', function(e){
      var tool=window.__anno.tool; if(!tool) return;
      e.stopPropagation(); e.preventDefault(); anno.setPointerCapture(e.pointerId);
      var p=pt(e);
      if(tool==='eraser'){ drawing=true; eraseBatch=[]; eraseAt(p); return; }
      if(tool==='pen'){ drawing=true; cur=document.createElementNS(NS,'path'); cur.setAttribute('d','M'+p.x+' '+p.y); style(cur); anno.appendChild(cur); return; }
      if(tool==='shape'){ drawing=true; start=p; cur=makeShape(shapeType(),p.x,p.y,p.x,p.y); anno.appendChild(cur); return; }
    });
    anno.addEventListener('pointermove', function(e){
      if(!drawing) return; var tool=window.__anno.tool, p=pt(e);
      if(tool==='eraser'){ eraseAt(p); return; }

    function renderRest(){

      }

    function refreshResultsNav(){ ensureResultsShell(); syncShortlistNav(); renderRest(); }
    function liveResultsNav(){ refreshResultsNav(); }
    function syncShortlistNav(){
      var row=document.getElementById('bk-recrow'); if(!row) return;
      var rec=recommendedNow();
      if(rec.length===0){
        if(!row.querySelector('.bk-reshint')) row.innerHTML='<div class="bk-reshint">Finding questions to discuss…</div>';
        return;
      }
      var hint=row.querySelector('.bk-reshint'); if(hint) hint.remove();
      var ids=rec.map(function(x){ return x.q.id; });
      Array.prototype.slice.call(row.children).forEach(function(node){ if(!node.getAttribute||ids.indexOf(node.getAttribute('data-qres'))<0) node.remove(); });
      rec.forEach(function(x,i){
        var node=row.querySelector('[data-qres="'+x.q.id+'"]');
        if(!node){
          var tmp=document.createElement('div'); tmp.innerHTML=resThumb(x.q,true); node=tmp.firstChild; node.classList.add('thumb--res-new');
          (function(nd){ setTimeout(function(){ nd.classList.remove('thumb--res-new'); },520); })(node);
        } else { var st=qState(x.q,bkProgress()); var acc=node.querySelector('.rest__acc'); if(acc) acc.textContent=st.acc+'%'; }
        var at=row.children[i]; if(at!==node) row.insertBefore(node, at||null);
      });
    }
    function showBk(){ if(bkPhase==='live') boardView(); else if(bkPhase==='complete') reviewView(); }

    function startBreakout(){
      if(bkPhase!=='planned') return;
      bkPhase='live'; bkRemaining=BK_TOTAL; bkRemoved={};
      film.classList.add('bk-live');
      renderBkThumb(); expandSubs(); liveResultsNav(); boardView();
      bkTimer=setInterval(function(){
        bkRemaining--;
        if(bkRemaining<=0){ completeBreakout(); return; }
        var tt=document.getElementById('bkt-time'); if(tt) tt.textContent=bkFmt(bkRemaining);
        syncShortlistNav(); renderRest();
        if(document.getElementById('bk-fin')){ updateBoard(); }
      },1000);
    }
    function completeBreakout(){
      if(bkTimer){ clearInterval(bkTimer); bkTimer=null; }
      bkPhase='complete'; film.classList.remove('bk-live'); bkRestOpen=false; renderBkThumb(); refreshResultsNav();
      if(document.getElementById('bk-thumb').classList.contains('on')) reviewView();
    }

    function makeSub(id,label,t,k){
      var el=document.createElement('div'); el.className='thumb thumb--sub thumb--sub-'+k; el.setAttribute('data-qpeek',id);
      el.innerHTML='<div class="subt"><span class="subt__n">'+label+'</span><span class="subt__t">'+t+'</span></div>';
      el.addEventListener('click',function(){ document.querySelectorAll('.thumb').forEach(function(x){ x.classList.remove('on'); }); el.classList.add('on'); previewSlide(id); });
      return el;
    }

    function buildSubs(){
      if(document.getElementById('bk-subs')) return;
      var wrap=document.createElement('div'); wrap.className='bk-subs'; wrap.id='bk-subs';
      wrap.addEventListener('click',function(e){
        if(bkPhase==='planned') return;
        var el;
        if(e.target.closest('[data-bkmore]')){ bkRestOpen=true; renderRest(); return; }
        if(e.target.closest('[data-bkless]')){ bkRestOpen=false; renderRest(); return; }
        if(el=e.target.closest('[data-qres]')){ document.querySelectorAll('.thumb').forEach(function(x){ x.classList.remove('on'); }); el.classList.add('on'); resultSlide(qFind(el.getAttribute('data-qres'))); return; }
        if(el=e.target.closest('[data-qpeek]')){ document.querySelectorAll('.thumb').forEach(function(x){ x.classList.remove('on'); }); el.classList.add('on'); previewSlide(el.getAttribute('data-qpeek')); return; }
      });
      wrap.appendChild(makeSub('video',I_PLAY,'Worked example','v'));
      BK.acts.forEach(function(act,ai){
        var cov=document.createElement('div'); cov.className='thumb thumb--actcover'; cov.setAttribute('data-act',act.id);
        cov.innerHTML='<div class="cov-mini">'+coverPageMarkup(act)+'</div><span class="actc__cv">'+SVG_CARET+'</span>';
        wrap.appendChild(cov);
        var grp=document.createElement('div'); grp.className='bk-qgroup'; grp.id='bk-qgroup-'+act.id;
        act.qs.forEach(function(q){ grp.appendChild(makeSub(q.id,'Q'+q._n,q.prompt,'q')); });
        wrap.appendChild(grp);
        cov.addEventListener('click',function(e){
          e.stopPropagation();
          if(e.target.closest('.actc__cv')){ var g=document.getElementById('bk-qgroup-'+act.id); cov.classList.toggle('expanded', g.classList.toggle('open')); return; }
          document.querySelectorAll('.thumb').forEach(function(x){ x.classList.remove('on'); }); cov.classList.add('on');
          activityCover(act);
        });
      });
      var bt=document.getElementById('bk-thumb'); bt.parentNode.insertBefore(wrap, bt.nextSibling);
    }
    function expandSubs(){ buildSubs(); var w=document.getElementById('bk-subs'); if(w) w.classList.add('open'); var bt=document.getElementById('bk-thumb'); if(bt) bt.classList.add('expanded'); }

      }
    }
    slideEl.addEventListener('click', function(e){
      var el;
      if(el=e.target.closest('[data-qpeek]')){ e.stopPropagation(); previewSlide(el.getAttribute('data-qpeek')); return; }
      if(el=e.target.closest('[data-qres]')){ e.stopPropagation(); resultSlide(qFind(el.getAttribute('data-qres'))); return; }
      if(e.target.closest('[data-bkback]')){ e.stopPropagation(); if(bkBackTo) bkBackTo(); return; }
    });
  })();
})();
(function(){
  var film=document.getElementById('film'); if(!film) return;
  var SEL='.thumb[data-i], .thumb--actcover, .thumb--sub';
  function arm(){ film.querySelectorAll(SEL).forEach(function(el){ el.draggable=true; }); }
  arm();
  var dragEl=null, dragParent=null;
  film.addEventListener('dragstart', function(e){
    var el=e.target.closest(SEL); if(!el) return;
    dragEl=el; dragParent=el.parentNode; el.classList.add('dragging');
    try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',''); }catch(_){}
  });
  film.addEventListener('dragend', function(){ if(dragEl) dragEl.classList.remove('dragging'); dragEl=null; dragParent=null; arm(); });
  film.addEventListener('dragover', function(e){
    if(!dragEl) return;
    var over=e.target.closest('.thumb'); if(!over||over===dragEl) return;
    if(over.parentNode!==dragParent) return;        /* stay within the same container (e.g. an activity) */
    e.preventDefault();
    var r=over.getBoundingClientRect(), after=e.clientX>r.left+r.width/2;
    if(dragEl.classList.contains('thumb--actcover')){
      var myGrp=document.getElementById('bk-qgroup-'+dragEl.getAttribute('data-act'));
      if(over.classList.contains('thumb--actcover')){
        var bGrp=document.getElementById('bk-qgroup-'+over.getAttribute('data-act'));
        var cR=over.getBoundingClientRect();
        var rightEdge=(bGrp&&bGrp.offsetParent)?bGrp.getBoundingClientRect().right:cR.right;
        var afterBlock=e.clientX>(cR.left+rightEdge)/2;
        dragParent.insertBefore(dragEl, afterBlock?((bGrp||over).nextSibling):over);
      } else {
        dragParent.insertBefore(dragEl, after?over.nextSibling:over);
      }
      if(myGrp) dragParent.insertBefore(myGrp, dragEl.nextSibling);
    } else {
      dragParent.insertBefore(dragEl, after?over.nextSibling:over);
    }
  });
})();
(function(){
  var pp=document.getElementById('pg-prev'), pn=document.getElementById('pg-next');
  if(pp) pp.addEventListener('click', function(){ if(window.__page) window.__page(-1); });
  if(pn) pn.addEventListener('click', function(){ if(window.__page) window.__page(1); });
  var btn=document.getElementById('focus-btn'); if(!btn) return;
  btn.addEventListener('click', function(){
    var on=document.body.classList.toggle('focus-mode');
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-label', on?'Exit focus mode':'Focus mode');
    if(on && window.__select) window.__select(true);
    if(window.__fit) window.__fit();
  });
})();
</script>
