<!doctype html>
<html lang="en" class="paper-mode">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440, initial-scale=1" />
<title>Noon Academy — Endless Canvas (Spatial)</title>
<link rel="stylesheet" href="assets/colors_and_type.css" />
<style>
  .paper-mode { --paper-100:#fdfdfc; --paper-200:#f7f6f3; --paper-300:#efeeea; }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--paper-200); color:var(--fg); }

  /* ===== Canvas ===== */
  .vp { position:fixed; inset:0; overflow:hidden; cursor:grab;
        background:
          radial-gradient(circle at 1px 1px, rgba(10,15,26,0.05) 1px, transparent 0) 0 0 / 28px 28px,
          linear-gradient(to bottom, var(--paper-200), var(--paper-100)); }
  .vp.grabbing { cursor:grabbing; }
  .world { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
  .route { position:absolute; overflow:visible; pointer-events:none; }

  .card { position:absolute; width:480px; height:270px; border-radius:8px; background:#fff;
          border:1px solid var(--border); box-shadow:0 18px 40px -18px rgba(10,15,26,0.30), 0 2px 8px rgba(10,15,26,0.06);
          overflow:hidden; cursor:pointer; transition:box-shadow var(--dur-2) var(--ease), transform var(--dur-2) var(--ease); }
  .card:hover{ box-shadow:0 24px 54px -16px rgba(10,15,26,0.34); }
  .card.sel{ box-shadow:0 0 0 2px var(--accent), 0 24px 54px -16px rgba(10,15,26,0.34); }
  .card__pad{ position:absolute; inset:0; padding:30px 34px; display:flex; flex-direction:column; }
  .card__caps{ font-family:var(--font-sans); font-size:11px; letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--fg-faint); }
  .card__caps b{ color:var(--fg-muted); font-weight:600; }
  .card h1{ font-family:var(--font-serif); font-size:32px; font-weight:500; letter-spacing:-0.02em; line-height:1.04; color:var(--ink); margin-top:14px; }
  .card h1 em{ font-style:italic; }
  .card p{ margin-top:10px; font-family:var(--font-sans); font-size:13px; line-height:1.5; color:rgba(10,15,26,0.6); max-width:42ch; }
  .card .eq{ margin-top:auto; font-family:var(--font-serif); font-style:italic; font-size:34px; color:var(--ink); }
  .card .eq sup{ font-size:60%; }
  .card__foot{ position:absolute; left:34px; right:34px; bottom:18px; display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:10px; color:var(--fg-faint); letter-spacing:0.05em; }

  /* video card */
  .card--video{ background:#23272f; }
  .card--video .play{ position:absolute; inset:0; margin:auto; width:72px; height:72px; border-radius:999px; background:rgba(253,253,252,0.94); display:flex; align-items:center; justify-content:center; color:var(--ink); }
  .card--video .play svg{ width:26px; height:26px; margin-left:3px; }
  .card--video img{ width:100%; height:100%; object-fit:cover; opacity:0.9; }

  /* activity cover card */
  .card--cover{ background:var(--blue-300); }
  .card--cover .disc{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:72%; height:168%; background:#fff; border-radius:50%; }
  .card--cover .cbody{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; }
  .card--cover .pill{ display:inline-flex; gap:8px; }
  .card--cover .pill span{ display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px; background:#fff; border:1px solid rgba(10,15,26,0.1); font-family:var(--font-sans); font-size:12px; font-weight:500; color:var(--ink); }
  .card--cover .pill svg{ width:12px; height:12px; color:var(--fg-muted); }
  .card--cover .cname{ font-family:var(--font-sans); font-size:30px; font-weight:600; color:var(--ink); }

  /* broadcast frame marker */
  .card.live::after{ content:"On screen"; position:absolute; top:10px; left:10px; padding:3px 9px; border-radius:5px; background:var(--signal-soft); border:1px solid var(--signal-border); color:var(--gold-500); font-family:var(--font-sans); font-size:9px; font-weight:700; letter-spacing:var(--tracking-caps); text-transform:uppercase; }
  .card.live{ box-shadow:0 0 0 2px var(--signal), 0 24px 54px -16px rgba(10,15,26,0.34); }

  /* ===== Floating instruments ===== */
  .fp{ position:fixed; z-index:20; background:var(--paper-100); border:1px solid var(--border); border-radius:12px;
       box-shadow:0 10px 30px -10px rgba(10,15,26,0.22), 0 2px 6px rgba(10,15,26,0.06); }
  .fp__grip{ cursor:grab; }
  .fp__grip:active{ cursor:grabbing; }

  /* class chip */
  .fp-class{ top:18px; left:18px; display:flex; align-items:center; gap:12px; padding:10px 14px; }
  .fp-class .t{ font-family:var(--font-serif); font-size:15px; color:var(--fg); }
  .fp-class .timer{ display:inline-flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:13px; color:var(--gold-500); padding-left:12px; border-left:1px solid var(--border); }
  .fp-class .dot{ width:6px;height:6px;border-radius:999px;background:var(--signal);box-shadow:0 0 0 4px rgba(201,162,39,0.18);animation:pulse 2.4s infinite; }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  /* tool rail */
  .fp-tools{ top:50%; left:18px; transform:translateY(-50%); display:flex; flex-direction:column; padding:6px; gap:4px; }
  .fp-tools__head{ height:14px; display:flex; align-items:center; justify-content:center; color:var(--fg-faint); }
  .fp-tools__head svg{ width:14px; height:5px; }
  .tbtn{ width:40px; height:40px; border-radius:8px; border:none; background:transparent; color:var(--fg-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .tbtn:hover{ background:var(--hover-overlay); color:var(--fg); }
  .tbtn.on{ background:var(--accent-soft); color:var(--accent); }
  .tbtn svg{ width:17px; height:17px; }
  .fp--collapsed .fp-tools__body{ display:none; }

  /* stage strip */
  .fp-stage{ top:18px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; padding:8px 12px; }
  .fp-stage .count{ display:flex; flex-direction:column; align-items:center; font-family:var(--font-mono); font-size:11px; color:var(--terra); }
  .fp-stage .count svg{ width:13px; height:13px; }
  .av{ width:38px; height:38px; border-radius:999px; overflow:hidden; border:1px solid var(--border-strong); background:var(--paper-300); display:flex; align-items:center; justify-content:center; font-family:var(--font-sans); font-weight:600; font-size:13px; color:var(--fg-muted); }
  .av img{ width:100%; height:100%; object-fit:cover; }
  .av--me{ box-shadow:0 0 0 2px var(--paper-100), 0 0 0 3px var(--terra-border); }
  .fp-stage .hand{ display:flex; flex-direction:column; align-items:center; gap:2px; height:40px; justify-content:center; padding:0 8px; border-radius:8px; background:var(--iris-soft); border:1px solid var(--iris-border); color:var(--iris); cursor:pointer; }
  .fp-stage .hand svg{ width:14px; height:14px; } .fp-stage .hand b{ font-family:var(--font-mono); font-size:9px; }

  /* chat */
  .fp-chat{ right:18px; bottom:18px; width:300px; display:flex; flex-direction:column; max-height:60vh; }
  .fp-chat__head{ display:flex; align-items:center; justify-content:space-between; padding:11px 14px; border-bottom:1px solid var(--border); }
  .fp-chat__head b{ font-family:var(--font-sans); font-size:13px; font-weight:600; letter-spacing:var(--tracking-caps); text-transform:uppercase; color:var(--fg); }
  .fp-chat__msgs{ overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:10px; }
  .msg{ display:flex; gap:9px; } .msg .a{ width:26px;height:26px;border-radius:999px;flex:0 0 auto;overflow:hidden; } .msg .a img{width:100%;height:100%;object-fit:cover}
  .msg .n{ font-family:var(--font-sans); font-size:12px; font-weight:600; color:var(--fg-muted); }
  .msg .x{ font-family:var(--font-sans); font-size:13px; color:var(--fg); line-height:1.4; }
  .fp-chat__in{ display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--border); }
  .fp-chat__in input{ flex:1; border:1px solid var(--border-strong); border-radius:6px; padding:7px 10px; font-family:var(--font-sans); font-size:13px; background:#fff; outline:none; }
  .fp-chat.fp--collapsed{ width:auto; max-height:none; }
  .fp-chat.fp--collapsed .fp-chat__msgs, .fp-chat.fp--collapsed .fp-chat__in{ display:none; }
  .fp-chat.fp--collapsed .fp-chat__head{ border-bottom:none; }
  .iconbtn{ width:26px;height:26px;border:none;background:transparent;color:var(--fg-faint);cursor:pointer;border-radius:6px;display:inline-flex;align-items:center;justify-content:center; }
  .iconbtn:hover{ background:var(--hover-overlay); color:var(--fg-muted); } .iconbtn svg{ width:15px;height:15px; }

  /* zoom control */
  .fp-zoom{ left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:2px; padding:5px; }
  .fp-zoom button{ height:34px; min-width:34px; padding:0 10px; border:none; background:transparent; color:var(--fg-muted); cursor:pointer; border-radius:8px; font-family:var(--font-mono); font-size:13px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  .fp-zoom button:hover{ background:var(--hover-overlay); color:var(--fg); }
  .fp-zoom .sep{ width:1px; height:20px; background:var(--border); margin:0 2px; }
  .fp-zoom svg{ width:16px; height:16px; }

  /* minimap */
  .fp-map{ left:18px; bottom:18px; width:190px; height:120px; padding:8px; }
  .fp-map__c{ position:relative; width:100%; height:100%; background:var(--paper-300); border-radius:6px; overflow:hidden; cursor:pointer; }
  .mm-dot{ position:absolute; background:var(--terra); border-radius:2px; opacity:0.8; }
  .mm-dot.live{ background:var(--signal); opacity:1; }
  .mm-view{ position:absolute; border:1.5px solid var(--accent); border-radius:2px; background:rgba(42,138,106,0.08); pointer-events:none; }

  /* contextual selection toolbar */
  .ctx{ position:fixed; z-index:25; display:none; align-items:center; gap:2px; padding:4px; background:var(--paper-100); border:1px solid var(--border-strong); border-radius:10px; box-shadow:0 8px 24px -8px rgba(10,15,26,0.28); transform:transl(-50%,0); }
  .ctx.show{ display:flex; }
  .ctx button{ height:32px; padding:0 12px; border:none; background:transparent; color:var(--fg-muted); cursor:pointer; border-radius:7px; font-family:var(--font-sans); font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  .ctx button:hover{ background:var(--hover-overlay); color:var(--fg); }
  .ctx button.primary{ background:var(--accent); color:var(--accent-fg); }
  .ctx button.primary:hover{ background:var(--accent-hover); }
  .ctx svg{ width:14px; height:14px; }
  .ctx .sep{ width:1px; height:20px; background:var(--border); margin:0 3px; }

  .hint{ position:fixed; bottom:18px; right:332px; font-family:var(--font-mono); font-size:10px; color:var(--fg-faint); z-index:5; }
  /* ported: chat lock + raised-hands popover */
  #chatlock.on{ color:var(--accent); }
  .fp-chat__in.locked input{ background:var(--paper-300); color:var(--fg-faint); cursor:not-allowed; }
  .rhpop{ position:fixed; z-index:30; width:300px; background:var(--paper-100); border:1px solid var(--border); border-radius:12px; box-shadow:0 14px 36px -12px rgba(10,15,26,0.3); padding:12px; }
  .rhpop[hidden]{ display:none; }
  .rhpop__lower{ width:100%; height:38px; border:1px solid var(--border-strong); border-radius:999px; background:transparent; font-family:var(--font-sans); font-size:13px; font-weight:600; color:var(--fg); cursor:pointer; }
  .rhpop__lower:hover{ background:var(--hover-overlay); }
  .rhpop__t{ font-family:var(--font-sans); font-size:12px; font-weight:700; color:var(--fg); margin:12px 2px 4px; }
  .rhrow{ display:grid; grid-template-columns:34px 1fr auto; align-items:center; gap:10px; padding:6px 2px; }
  .rhav{ width:34px;height:34px;border-radius:999px;background:var(--paper-300);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);font-weight:600;font-size:13px;color:var(--fg-muted); }
  .rhn{ font-family:var(--font-sans);font-size:14px;font-weight:500;color:var(--fg); }
  .rhs{ font-family:var(--font-sans);font-size:11px;color:var(--fg-muted); }
  .rhup{ width:32px;height:32px;border-radius:999px;background:var(--iris-soft);border:1px solid var(--iris-border);color:var(--iris);cursor:pointer;display:inline-flex;align-items:center;justify-content:center; }
  .rhup:hover{ background:rgba(142,99,224,0.16); } .rhup svg{ width:15px;height:15px; }
</style>
</head>
<body>

<div class="vp" id="vp">
  <div class="world" id="world">
    <svg class="route" id="route"></svg>
  </div>
</div>

<!-- floating instruments -->
<div class="fp fp-class"><span class="fp__grip" data-drag></span><span class="dot"></span><span class="t">Trigonometric Identities</span><span class="timer">47:32 <span style="color:var(--fg-faint)">/ 60:00</span></span></div>

<div class="fp fp-tools" id="fp-tools">
  <div class="fp-tools__head" data-drag><svg viewBox="0 0 24 6" fill="currentColor"><circle cx="6" cy="3" r="1.4"/><circle cx="12" cy="3" r="1.4"/><circle cx="18" cy="3" r="1.4"/></svg></div>
  <div class="fp-tools__body">
    <button class="tbtn" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg></button>
    <button class="tbtn" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 15-6.7L21 13"/></svg></button>
    <button class="tbtn on" aria-label="Pen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/></svg></button>
    <button class="tbtn" aria-label="Shapes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
    <button class="tbtn" aria-label="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16c-1-1-1-2.5 0-3.5L13 3c1-1 2.5-1 3.5 0L21 7c1 1 1 2.5 0 3.5L11 20"/></svg></button>
  </div>
</div>

<div class="fp fp-stage" id="fp-stage">
  <span class="fp__grip" data-drag style="width:14px;height:24px;cursor:grab;display:inline-flex;align-items:center;color:var(--fg-faint)"><svg viewBox="0 0 6 24" fill="currentColor"><circle cx="3" cy="6" r="1.3"/><circle cx="3" cy="12" r="1.3"/><circle cx="3" cy="18" r="1.3"/></svg></span>
  <span class="count"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>540</span>
  <span class="av av--me"><img src="assets/teacher-ali.jpg.png" alt=""></span>
  <span class="av"><img src="assets/classroom-a.jpg" alt=""></span>
  <span class="av"><img src="assets/classroom-b.jpg" alt=""></span>
  <span class="av"><img src="assets/classroom-d.jpg" alt=""></span>
  <span class="hand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg><b>3</b></span>
</div>

<div class="fp fp-chat" id="fp-chat">
  <div class="fp-chat__head" data-drag><b>Chat</b><button class="iconbtn" id="chatlock" aria-label="Lock chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button><button class="iconbtn" data-collapse aria-label="Collapse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button></div>
  <div class="fp-chat__msgs" id="chat-msgs"></div>
  <div class="fp-chat__in"><input type="text" placeholder="Write a message…"><button class="iconbtn" style="color:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div>
</div>

<div class="fp fp-zoom">
  <button id="z-out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  <button id="z-pct">100%</button>
  <button id="z-in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  <span class="sep"></span>
  <button id="z-fit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg> Fit</button>
  <button id="z-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg> Recenter</button>
</div>

<div class="fp fp-map"><div class="fp-map__c" id="mm"><div class="mm-view" id="mm-view"></div></div></div>

<div class="ctx" id="ctx">
  <button class="primary" id="ctx-present"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg> Present</button>
  <span class="sep"></span>
  <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg> Annotate</button>
  <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg> Duplicate</button>
</div>

<div class="hint">scroll to zoom · drag to pan · click a slide</div>

<script>
(function(){
  var vp=document.getElementById('vp'), world=document.getElementById('world'), routeSvg=document.getElementById('route');
  var tx=0, ty=0, scale=1;
  var SLIDES=[
    {id:'s1', x:0,   y:0,   kind:'slide', caps:'SLIDE 01 / 12 · WHY CIRCLES?', h1:'Trigonometry begins on a <em>circle</em>.', p:'Angles are hard to compare. Put one at the centre of a circle of radius 1, and every angle becomes coordinates.', fig:'FIG. 01'},
    {id:'s2', x:600, y:150, kind:'video'},
    {id:'s3', x:1200,y:-30, kind:'eq', caps:'SLIDE 03 / 12 · THE PYTHAGOREAN IDENTITY', h1:'The unit circle is a <em>compass</em>.', eq:'sin<sup>2</sup>θ + cos<sup>2</sup>θ = 1', fig:'FIG. 03'},
    {id:'a1', x:1800,y:170, kind:'cover'},
    {id:'s9', x:2400,y:10,  kind:'eq', caps:'SLIDE 09 / 12 · QUOTIENT IDENTITY', h1:'Tangent is a <em>quotient</em>.', eq:'tan θ = sin θ ⁄ cos θ', fig:'FIG. 09'}
  ];
  var liveId='s1', selId=null, cardEls={};

  function cardHTML(s){
    if(s.kind==='video') return '<img src="assets/sine-wave.jpg" alt=""><div class="play"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg></div>';
    if(s.kind==='cover') return '<div class="disc"></div><div class="cbody"><div class="pill"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg> 06:00</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg> Team</span></div><div class="cname">Sine ratios</div></div>';
    var inner='<div class="card__pad"><div class="card__caps">'+(s.caps||'')+'</div><h1>'+(s.h1||'')+'</h1>';
    if(s.p) inner+='<p>'+s.p+'</p>';
    if(s.eq) inner+='<div class="eq">'+s.eq+'</div>';
    inner+='</div><div class="card__foot"><span>NOON ACADEMY · GRADE 11 · MATH</span><span>'+(s.fig||'')+'</span></div>';
    return inner;
  }
  SLIDES.forEach(function(s){
    var el=document.createElement('div');
    el.className='card'+(s.kind==='video'?' card--video':'')+(s.kind==='cover'?' card--cover':'');
    el.style.left=s.x+'px'; el.style.top=s.y+'px';
    el.innerHTML=cardHTML(s);
    el.addEventListener('click', function(e){ e.stopPropagation(); select(s.id); });
    world.appendChild(el); cardEls[s.id]=el;
  });
  function drawRoute(){
    var pts=SLIDES.map(function(s){ return (s.x+240)+','+(s.y+135); });
    routeSvg.setAttribute('width','3200'); routeSvg.setAttribute('height','800');
    routeSvg.style.left='0'; routeSvg.style.top='-100px';
    routeSvg.innerHTML='<polyline points="'+SLIDES.map(function(s){return (s.x+240)+','+(s.y+135+100);}).join(' ')+'" fill="none" stroke="rgba(201,162,39,0.5)" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round"/>';
  }
  drawRoute();

  function clampS(v){ return Math.max(0.35, Math.min(2.2, v)); }
  function apply(){
    world.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
    document.getElementById('z-pct').textContent=Math.round(scale*100)+'%';
    SLIDES.forEach(function(s){ cardEls[s.id].classList.toggle('live', s.id===liveId); cardEls[s.id].classList.toggle('sel', s.id===selId); });
    positionCtx(); drawMinimap();
  }

  /* pan */
  var panning=false, sx,sy,otx,oty;
  vp.addEventListener('pointerdown', function(e){
    if(e.target.closest('.fp,.card,.ctx')) return;
    panning=true; vp.classList.add('grabbing'); sx=e.clientX; sy=e.clientY; otx=tx; oty=ty; vp.setPointerCapture(e.pointerId);
    select(null);
  });
  vp.addEventListener('pointermove', function(e){ if(panning){ tx=otx+(e.clientX-sx); ty=oty+(e.clientY-sy); apply(); } });
  vp.addEventListener('pointerup', function(){ panning=false; vp.classList.remove('grabbing'); });
  /* zoom toward cursor */
  vp.addEventListener('wheel', function(e){
    e.preventDefault();
    var r=vp.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    var ns=clampS(scale*(e.deltaY<0?1.12:0.89)), k=ns/scale;
    tx=mx-(mx-tx)*k; ty=my-(my-ty)*k; scale=ns; apply();
  }, {passive:false});
  vp.addEventListener('dblclick', function(e){ if(!e.target.closest('.fp,.card,.ctx')) fitAll(); });

  /* camera tween */
  function tween(nx,ny,ns){
    var ox=tx,oy=ty,os=scale,t0=performance.now(),dur=420;
    function f(now){ var k=Math.min(1,(now-t0)/dur); var e=1-Math.pow(1-k,3);
      tx=ox+(nx-ox)*e; ty=oy+(ny-oy)*e; scale=os+(ns-os)*e; apply();
      if(k<1) requestAnimationFrame(f);
    } requestAnimationFrame(f);
  }
  function frameOf(rect, pad){
    pad=pad||90; var vw=vp.clientWidth, vh=vp.clientHeight;
    var ns=clampS(Math.min((vw-pad*2)/rect.w, (vh-pad*2)/rect.h));
    var nx=vw/2 - (rect.x+rect.w/2)*ns, ny=vh/2 - (rect.y+rect.h/2)*ns;
    return {nx:nx,ny:ny,ns:ns};
  }
  function focusCard(id){ var s=SLIDES.filter(function(x){return x.id===id;})[0]; var fr=frameOf({x:s.x,y:s.y,w:480,h:270},120); tween(fr.nx,fr.ny,fr.ns); }
  function bounds(){ var xs=SLIDES.map(s=>s.x), ys=SLIDES.map(s=>s.y); return {x:Math.min.apply(null,xs)-40, y:Math.min.apply(null,ys)-40, w:(Math.max.apply(null,xs)+480+40)-(Math.min.apply(null,xs)-40), h:(Math.max.apply(null,ys)+270+40)-(Math.min.apply(null,ys)-40)}; }
  function fitAll(){ var b=bounds(); var fr=frameOf(b,70); tween(fr.nx,fr.ny,fr.ns); }

  /* select + contextual toolbar */
  function select(id){ selId=id; var ctx=document.getElementById('ctx'); ctx.classList.toggle('show', !!id); apply(); }
  function positionCtx(){
    var ctx=document.getElementById('ctx'); if(!selId){ return; }
    var s=SLIDES.filter(function(x){return x.id===selId;})[0];
    var cx=(s.x+240)*scale+tx, top=(s.y)*scale+ty;
    ctx.style.left=cx+'px'; ctx.style.top=(top-46)+'px'; ctx.style.transform='translateX(-50%)';
  }
  document.getElementById('ctx-present').addEventListener('click', function(){ if(selId){ liveId=selId; focusCard(selId); } });

  /* zoom buttons */
  function zoomBtn(f){ var r=vp.getBoundingClientRect(), mx=vp.clientWidth/2, my=vp.clientHeight/2; var ns=clampS(scale*f), k=ns/scale; tx=mx-(mx-tx)*k; ty=my-(my-ty)*k; scale=ns; apply(); }
  document.getElementById('z-in').onclick=function(){ zoomBtn(1.15); };
  document.getElementById('z-out').onclick=function(){ zoomBtn(0.87); };
  document.getElementById('z-fit').onclick=fitAll;
  document.getElementById('z-home').onclick=function(){ focusCard(liveId); };

  /* minimap */
  var mm=document.getElementById('mm'), mmView=document.getElementById('mm-view');
  var mmDots={};
  SLIDES.forEach(function(s){ var d=document.createElement('div'); d.className='mm-dot'; mm.appendChild(d); mmDots[s.id]=d; });
  function drawMinimap(){
    var b=bounds(), mw=mm.clientWidth, mh=mm.clientHeight, pad=6;
    var k=Math.min((mw-pad*2)/b.w, (mh-pad*2)/b.h);
    var ox=pad+(mw-pad*2 - b.w*k)/2, oy=pad+(mh-pad*2 - b.h*k)/2;
    SLIDES.forEach(function(s){ var d=mmDots[s.id]; d.style.left=(ox+(s.x-b.x)*k)+'px'; d.style.top=(oy+(s.y-b.y)*k)+'px'; d.style.width=Math.max(6,480*k)+'px'; d.style.height=Math.max(4,270*k)+'px'; d.classList.toggle('live', s.id===liveId); });
    /* viewport rect in world coords */
    var vx=-tx/scale, vy=-ty/scale, vw=vp.clientWidth/scale, vh=vp.clientHeight/scale;
    mmView.style.left=(ox+(vx-b.x)*k)+'px'; mmView.style.top=(oy+(vy-b.y)*k)+'px';
    mmView.style.width=(vw*k)+'px'; mmView.style.height=(vh*k)+'px';
  }
  mm.addEventListener('click', function(e){
    var b=bounds(), mw=mm.clientWidth, mh=mm.clientHeight, pad=6;
    var k=Math.min((mw-pad*2)/b.w, (mh-pad*2)/b.h);
    var ox=pad+(mw-pad*2 - b.w*k)/2, oy=pad+(mh-pad*2 - b.h*k)/2;
    var r=mm.getBoundingClientRect(); var wx=b.x+(e.clientX-r.left-ox)/k, wy=b.y+(e.clientY-r.top-oy)/k;
    tween(vp.clientWidth/2 - wx*scale, vp.clientHeight/2 - wy*scale, scale);
  });

  /* floating panel drag + collapse */
  document.querySelectorAll('.fp').forEach(function(fp){
    var grip=fp.querySelector('[data-drag]'); if(!grip) return;
    grip.addEventListener('pointerdown', function(e){
      e.preventDefault(); var r=fp.getBoundingClientRect(); var ox=e.clientX-r.left, oy=e.clientY-r.top;
      fp.style.transform='none'; fp.style.left=r.left+'px'; fp.style.top=r.top+'px'; fp.style.right='auto'; fp.style.bottom='auto';
      function mv(ev){ fp.style.left=(ev.clientX-ox)+'px'; fp.style.top=(ev.clientY-oy)+'px'; }
      function up(){ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); }
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    });
  });
  document.querySelectorAll('[data-collapse]').forEach(function(b){ b.addEventListener('click', function(){ b.closest('.fp').classList.toggle('fp--collapsed'); }); });

  /* chat content */
  var CH=[['احمد جمال','assets/classroom-a.jpg','Thanks, mam — that helped'],['Jannat Fatima','assets/classroom-b.jpg','The unit circle part is clear now'],['Sara Khalid','assets/classroom-d.jpg','Can we get this as PDF?']];
  document.getElementById('chat-msgs').innerHTML=CH.map(function(m){ return '<div class="msg"><div class="a"><img src="'+m[1]+'"></div><div><div class="n">'+m[0]+'</div><div class="x">'+m[2]+'</div></div></div>'; }).join('');

  /* init */
  focusCard('s1'); apply();
  /* ---- ported: chat lock ---- */
  (function(){
    var cl=document.getElementById('chatlock'), ci=document.querySelector('.fp-chat__in input'), cw=document.querySelector('.fp-chat__in'); var locked=false;
    if(cl&&ci&&cw){ cl.addEventListener('click', function(e){ e.stopPropagation(); locked=!locked; cl.classList.toggle('on',locked); ci.disabled=locked; cw.classList.toggle('locked',locked); ci.placeholder=locked?'Chat is locked':'Write a message…'; }); }
  })();
  /* ---- ported: raised-hands popover ---- */
  (function(){
    var hand=document.querySelector('.fp-stage .hand'); if(!hand) return;
    var UP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
    var hands=[['Laiba Suleman','Grade 11, Classroom A'],['Amr Mohammed','Grade 11, Classroom A'],['Sara Khalid','Grade 10, Classroom B']];
    var pop=document.createElement('div'); pop.className='rhpop'; pop.hidden=true;
    pop.innerHTML='<button class="rhpop__lower">Lower all hands</button><div class="rhpop__t">Raised Hands ('+hands.length+')</div>'+hands.map(function(h){ return '<div class="rhrow"><div class="rhav">'+h[0].charAt(0)+'</div><div><div class="rhn">'+h[0]+'</div><div class="rhs">'+h[1]+'</div></div><button class="rhup">'+UP+'</button></div>'; }).join('');
    document.body.appendChild(pop);
    hand.style.cursor='pointer';
    hand.addEventListener('click', function(e){ e.stopPropagation(); if(pop.hidden){ var r=hand.getBoundingClientRect(); pop.style.left=Math.max(12,Math.min(window.innerWidth-312, r.left-130))+'px'; pop.style.top=(r.bottom+10)+'px'; pop.hidden=false; } else pop.hidden=true; });
    document.addEventListener('click', function(e){ if(!pop.hidden && !pop.contains(e.target) && !hand.contains(e.target)) pop.hidden=true; });
    pop.addEventListener('click', function(e){ if(e.target.closest('.rhpop__lower')||e.target.closest('.rhup')) pop.hidden=true; });
  })();
})();
</script>
</body>
</html>
